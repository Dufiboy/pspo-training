<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PSPO">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#5340d6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<title>PSPO Practice Arena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f1ff;--surface:#ffffff;--surface2:#ebe7ff;--ink:#1c1840;--muted:#625d86;--line:#dcd6f5;
  --brand:#5340d6;--brand-ink:#ffffff;--sun:#ffc83d;--sun-ink:#3a2a00;
  --good:#0f8a62;--good-bg:#dcf5ea;--warn:#b45f06;--warn-bg:#fff0d6;--shadow:0 8px 24px rgba(52,36,140,.12);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#13112b;--surface:#1d1a40;--surface2:#2b2760;--ink:#f1eeff;--muted:#aaa4d6;--line:#38336f;
    --brand:#9a8fff;--brand-ink:#13112b;--sun:#ffd24f;--sun-ink:#3a2a00;
    --good:#4fe0a8;--good-bg:#10382c;--warn:#ffb85c;--warn-bg:#3b2a10;--shadow:0 8px 24px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#13112b;--surface:#1d1a40;--surface2:#2b2760;--ink:#f1eeff;--muted:#aaa4d6;--line:#38336f;
  --brand:#9a8fff;--brand-ink:#13112b;--sun:#ffd24f;--sun-ink:#3a2a00;
  --good:#4fe0a8;--good-bg:#10382c;--warn:#ffb85c;--warn-bg:#3b2a10;--shadow:0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
h1,h2,h3{font-family:'Fredoka','Nunito',system-ui,sans-serif;margin:0;font-weight:600;line-height:1.15}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
#app{max-width:640px;margin:0 auto;padding:0 16px 40px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;background:var(--bg);display:flex;align-items:center;gap:12px;padding:12px 0}
.top h1{font-size:22px;flex:1}
.iconbtn{width:44px;height:44px;border-radius:14px;background:var(--surface);box-shadow:var(--shadow);font-size:20px;display:grid;place-items:center;flex:none}
.card{background:var(--surface);border-radius:22px;padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
.card h2{font-size:19px;margin-bottom:10px}
.muted{color:var(--muted)}
.small{font-size:14px}
.btn{display:block;width:100%;min-height:54px;border-radius:18px;padding:12px 18px;font-weight:800;font-size:17px;background:var(--brand);color:var(--brand-ink);text-align:center;transition:transform .12s}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.alt{background:var(--surface2);color:var(--ink)}
.btn.sun{background:var(--sun);color:var(--sun-ink)}
.row{display:flex;gap:10px}
.row>*{flex:1}
.hero{padding:6px 0 18px}
.hero h2{font-size:34px;letter-spacing:-.01em}
.hero p{margin:8px 0 0;color:var(--muted);max-width:34ch}
.levels{display:flex;gap:8px;flex-wrap:wrap}
.lvl{padding:10px 16px;border-radius:999px;background:var(--surface2);font-weight:800;min-height:44px}
.lvl[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
.lvl[disabled]{opacity:.55;cursor:default}
.lvl small{font-weight:700;opacity:.85;margin-left:4px}
.sliderbox{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px}
.sliderbox b{font-family:'Fredoka',sans-serif;font-size:34px;color:var(--brand)}
input[type=range]{width:100%;height:44px;accent-color:var(--brand);margin:0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.stat{background:var(--surface);border-radius:18px;padding:10px 6px;text-align:center;box-shadow:var(--shadow)}
.stat b{display:block;font-family:'Fredoka',sans-serif;font-size:22px}
.stat span{font-size:12px;color:var(--muted)}
.trow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.trow:first-of-type{border-top:0}
.trow .em{font-size:22px;width:30px;text-align:center}
.trow .nm{flex:1;min-width:0;font-weight:700;font-size:15px;line-height:1.25}
.meter{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden;margin-top:5px}
.meter i{display:block;height:100%;background:var(--good);border-radius:99px}
.heat{font-size:20px;width:28px;text-align:center}
.shelf{display:flex;flex-wrap:wrap;gap:4px;font-size:24px}
.resume{background:var(--sun);color:var(--sun-ink)}
.resume .btn{background:var(--sun-ink);color:var(--sun);margin-top:10px}
.foot{font-size:13px;color:var(--muted);text-align:center;margin-top:20px;line-height:1.45}

/* quiz */
.bar{flex:1;height:12px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--sun));border-radius:99px;transition:width .35s}
.meta{font-weight:800;min-width:64px;text-align:right;font-size:15px;white-space:nowrap}
.chip{display:inline-block;padding:4px 12px;border-radius:99px;background:var(--surface2);font-size:13px;font-weight:700;margin-bottom:12px}
.qtext{font-family:'Fredoka',sans-serif;font-size:21px;line-height:1.3;font-weight:500;margin:0 0 16px}
.creature{display:flex;align-items:center;gap:12px;background:var(--warn-bg);border-radius:16px;padding:10px 12px;margin-bottom:14px}
.creature .cr{font-size:34px;animation:wob 2.2s ease-in-out infinite}
.creature b{display:block;font-size:14px}
.creature span{font-size:13px;color:var(--muted)}
.dots{letter-spacing:3px;color:var(--brand);font-weight:800}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:flex-start;gap:12px;text-align:left;width:100%;min-height:56px;padding:13px 14px;border-radius:16px;border:2px solid var(--line);background:var(--surface);font-weight:600;line-height:1.35;transition:border-color .15s,background .15s}
.opt .mk{flex:none;width:26px;height:26px;border:2px solid var(--line);display:grid;place-items:center;font-size:15px;font-weight:800;margin-top:-1px;background:var(--bg)}
.opt .mk.r{border-radius:50%}.opt .mk.c{border-radius:8px}
.opt.sel{border-color:var(--brand);background:var(--surface2)}
.opt.sel .mk{border-color:var(--brand);background:var(--brand);color:var(--brand-ink)}
.opt.ok{border-color:var(--good);background:var(--good-bg)}
.opt.ok .mk{border-color:var(--good);background:var(--good);color:var(--bg)}
.opt.miss{border-color:var(--warn);background:var(--warn-bg)}
.opt.miss .mk{border-color:var(--warn);background:var(--warn);color:var(--bg)}
.opt.dim{opacity:.6}
.fb{margin-top:16px;border-radius:18px;padding:14px 16px;animation:rise .3s ease-out}
.fb.good{background:var(--good-bg)}.fb.warn{background:var(--warn-bg)}
.fb h3{font-size:18px;margin-bottom:4px}
.fb p{margin:4px 0 0}
.fb .ev{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-weight:700}
.act{margin-top:16px}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:800;z-index:60;animation:rise .25s ease-out;box-shadow:var(--shadow)}

/* summary */
.sum{text-align:center;padding:8px 0}
.ringwrap{position:relative;width:200px;height:200px;margin:8px auto}
.ring{width:100%;height:100%}
.ring .trk{fill:none;stroke:var(--surface2);stroke-width:12}
.ring .prg{fill:none;stroke:var(--brand);stroke-width:12;stroke-linecap:round;transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1)}
.ring .pass{stroke:var(--sun);stroke-width:5;stroke-linecap:round}
.ringtxt{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ringtxt b{font-family:'Fredoka',sans-serif;font-size:46px;line-height:1}
.ringtxt span{color:var(--muted);font-weight:700}
.trophy{font-size:56px;animation:bounce .8s cubic-bezier(.3,1.6,.5,1) both}
.verdict{font-size:30px;margin:6px 0 4px}
.tag{display:inline-block;background:var(--surface2);border-radius:99px;padding:3px 12px;font-size:13px;font-weight:700;color:var(--muted)}
.parade{position:relative;height:48px;overflow:hidden;margin:6px 0 2px}
.parade div{position:absolute;white-space:nowrap;font-size:32px;animation:march 7s linear 1 both}
.brow{padding:8px 0}
.brow .hd{display:flex;justify-content:space-between;gap:8px;font-weight:700;font-size:15px}
.brow .hd span:last-child{white-space:nowrap}
.pbar{position:relative;height:12px;background:var(--surface2);border-radius:99px;margin-top:6px}
.pbar i{display:block;height:100%;border-radius:99px;background:var(--warn)}
.pbar i.p{background:var(--good)}
.pbar u{position:absolute;top:-3px;bottom:-3px;width:3px;background:var(--sun);border-radius:2px}
.focus{background:var(--warn-bg)}
.focus li{margin:8px 0}
ul.plain{margin:0;padding:0;list-style:none}
details{margin-top:8px}
summary{cursor:pointer;font-weight:800;padding:8px 0;min-height:44px;display:flex;align-items:center}
.miss-i{padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.miss-i b{display:block;margin-bottom:2px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,8,30,.55);z-index:70;display:flex;align-items:flex-end;justify-content:center}
.panel{background:var(--surface);width:100%;max-width:640px;border-radius:26px 26px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto;animation:rise .25s ease-out}
.seg{display:flex;gap:6px}
.seg button{flex:1;min-height:44px;border-radius:12px;background:var(--surface2);font-weight:800}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
.srow{margin:16px 0}
.srow>b{display:block;margin-bottom:8px}

.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:80}
.confetti span{position:absolute;top:-8vh;animation:fall linear forwards;will-change:transform}

.hearts{font-size:18px;letter-spacing:2px;white-space:nowrap;min-width:78px}
.ready{display:flex;gap:14px;align-items:center}
.ready .big{font-family:'Fredoka',sans-serif;font-size:46px;line-height:1;color:var(--brand)}
.ready .lab{font-weight:800}
.meter.big{height:12px}
.twist{background:var(--surface2);border-radius:16px;padding:8px 12px;margin-bottom:14px;font-weight:700;font-size:14px}
.nav{display:flex;gap:10px;margin-top:16px}
.nav .btn{min-height:50px}
.flagbtn{min-height:44px;padding:8px 14px;border-radius:14px;background:var(--surface2);font-weight:800}
.flagbtn[aria-pressed="true"]{background:var(--sun);color:var(--sun-ink)}
.grid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin:12px 0}
.gq{aspect-ratio:1;border-radius:10px;border:2px solid var(--line);font-weight:800;font-size:14px;position:relative;background:var(--surface);min-width:0}
.gq.a{background:var(--surface2);border-color:var(--brand)}
.gq.cur{outline:3px solid var(--sun)}
.gq.f::after{content:"🚩";position:absolute;top:-7px;right:-5px;font-size:12px}
.cheat li{margin:6px 0}
.qtext b{color:var(--brand);text-decoration:underline;text-underline-offset:3px}
.mini{width:40px;height:40px;border-radius:12px;background:var(--surface2);font-size:18px;display:grid;place-items:center;flex:none}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes wob{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
@keyframes bounce{0%{transform:scale(0) rotate(-20deg)}100%{transform:scale(1) rotate(0)}}
@keyframes fall{to{transform:translate3d(var(--dx),115vh,0) rotate(var(--rot))}}
@keyframes march{from{left:-100%}to{left:100%}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .parade div{position:static}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- storage ---------- */
const store={
  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},
  del(k){try{localStorage.removeItem(k)}catch(e){}}
};
const K={prog:'pspo1.prog',round:'pspo1.round',set:'pspo1.settings'};

/* ---------- content ---------- */
const THEMES=[
 {n:'Product Owner role & the eight stances',e:'🎭',r:'The Professional Product Owner (the stances) and the Scrum Guide section on the Product Owner'},
 {n:'Product vision & strategy',e:'🔭',r:'The Professional Product Owner: vision and strategy'},
 {n:'Product Goal & roadmapping',e:'🎯',r:'Scrum Guide: Product Goal, and the roadmapping chapter in the book'},
 {n:'Backlog management & ordering',e:'📋',r:'Scrum Guide: Product Backlog'},
 {n:'Value & Evidence-Based Management',e:'💎',r:'Scrum.org Evidence-Based Management Guide'},
 {n:'Stakeholders & customers',e:'🤝',r:'The Professional Product Owner: stakeholders and customers'},
 {n:'Experimentation & feedback',e:'🧪',r:'The Professional Product Owner: experiments and feedback loops'},
 {n:'Sprint Planning & Sprint Goal',e:'🗓️',r:'Scrum Guide: Sprint Planning and the Sprint'},
 {n:'Sprint Review & Retrospective',e:'🔁',r:'Scrum Guide: Sprint Review and Sprint Retrospective'},
 {n:'Increment & Definition of Done',e:'✅',r:'Scrum Guide: Increment and Definition of Done'},
 {n:'Scrum Team, Scrum Master & Developers',e:'👥',r:'Scrum Guide: The Scrum Team'},
 {n:'Scrum theory & values',e:'🧭',r:'Scrum Guide: Scrum Theory and Scrum Values'}
];
/* [theme, type s|m|t, question, options (null for true/false), correct indices, explanation] */
const Q=[
 [0,'s','Who is accountable for maximizing the value of the product resulting from the work of the Scrum Team?',['The Product Owner','The Scrum Master','The Developers','The stakeholders'],[0],'The Scrum Guide makes the Product Owner accountable for maximizing value. How they do it can vary a lot, but the accountability is theirs.'],
 [0,'t','The Product Owner is one person, not a committee.',null,[0],'True. The PO may represent the needs of many stakeholders, but it is one person, and anyone who wants to change the backlog has to convince that person.'],
 [0,'m','Which TWO are Product Owner accountabilities? (Choose 2)',['Developing and explicitly communicating the Product Goal','Ordering Product Backlog items','Assigning tasks to individual Developers','Facilitating the Daily Scrum'],[0,1],'The PO owns the Product Goal and the ordering of the Product Backlog. Developers manage their own work, and the Daily Scrum belongs to the Developers.'],
 [0,'s','The Product Owner has too much on their plate and wants help with Product Backlog management. What is true?',['They can delegate the work but remain accountable','Only the Product Owner may ever touch the Product Backlog','They must ask the Scrum Master for permission','Delegation is only allowed to stakeholders'],[0],'The Scrum Guide says the PO may do the work or have others do it, but the PO stays accountable.'],
 [0,'s','In the eight stances of a Product Owner, which stance is about forming hypotheses and testing them with real users?',['Experimenter','Visionary','Communicator','Leader'],[0],'The Experimenter stance is about validating assumptions through small, safe-to-fail experiments.'],
 [0,'s','A senior executive asks the Product Owner to move their favorite feature to the top of the Product Backlog. What is the best response?',['Listen, explain the value-based reasoning and decide the order transparently','Move it up immediately because the executive is senior and leadership should be kept happy','Let the Developers and stakeholders vote, and follow the majority outcome','Decline to talk to executives'],[0],'The PO stays open to input but keeps the decision authority and makes the reasoning transparent.'],
 [0,'s','Who has the authority to cancel a Sprint?',['The Product Owner','The Scrum Master','The Developers','The stakeholders'],[0],'Only the PO can cancel a Sprint, typically when the Sprint Goal becomes obsolete. Others may suggest it.'],

 [1,'s','What is the main purpose of a product vision?',['To describe the long-term purpose and inspire everyone toward a desired future','To list every feature planned for the next releases together with committed delivery dates','To fix the scope and schedule so the Developers know exactly what to build for a year','To replace the Sprint Goal'],[0],'A vision describes why the product exists and where it is heading. It guides decisions rather than fixing scope or dates.'],
 [1,'s','Which statement best describes a product strategy?',['A coherent approach for achieving the vision, e.g. target customers and how to stand out','A detailed plan of tasks that tells the Developers exactly what to build each Sprint','A detailed Gantt chart with milestones that shows who does what until release','The Definition of Done'],[0],'Strategy is the path to the vision: who it is for, what makes it different and how value will be created.'],
 [1,'t','A product vision should be shared only with the Product Owner to avoid confusion.',null,[1],'False. A vision only works when the Scrum Team and stakeholders know it and can align on it.'],
 [1,'m','Which TWO help keep a product vision alive and understood? (Choose 2)',['Making it visible, e.g. a short vision statement or board','Revisiting it in conversations and Sprint Reviews','Writing a 200-page requirements document','Sharing it only after release'],[0,1],'Visibility and regular conversation keep the vision a living guide rather than a forgotten document.'],
 [1,'s','A major market shift makes the current vision outdated. What should the Product Owner do?',['Update the vision, communicate it and adapt the Product Goal and Product Backlog','Ignore it until the current release is finished, then discuss the vision with stakeholders','Wait for the Scrum Master and management to decide how the vision should change','Keep the vision, since changing it shows weakness'],[0],'Scrum is built on inspection and adaptation, and that includes the vision when evidence says it should change.'],
 [1,'s','Which question best tests whether you have a clear product strategy?',['Who are we creating value for, and why would they choose us?','How many story points can the team deliver in a Sprint, and is that number growing?','How many meetings do we have?','Which tool do we use for tracking the Product Backlog and reporting progress?'],[0],'Strategy is about customers, value and differentiation, not internal output measures.'],
 [1,'t','Once agreed, a product vision should never change so the team stays focused.',null,[1],'False. A vision is stable but not frozen. New evidence can and should lead to changes.'],

 [2,'s','Which artifact contains the commitment called the Product Goal?',['The Product Backlog','The Sprint Backlog','The Increment','The roadmap'],[0],'Each artifact has a commitment: the Product Goal for the Product Backlog, the Sprint Goal for the Sprint Backlog and the Definition of Done for the Increment.'],
 [2,'s','How many Product Goals should a Scrum Team work toward at a time?',['One','As many as there are stakeholders','One per Developer','One per Sprint Goal'],[0],'The Scrum Team fulfills or abandons one Product Goal before taking on the next.'],
 [2,'t','The Product Goal is the commitment for the Product Backlog.',null,[0],'True. It describes a future state of the product and is a target for the Scrum Team to plan against.'],
 [2,'s','What is the best way to use a product roadmap?',['As a flexible, outcome-focused view of how the product may evolve','As a fixed contract with stakeholders that lists features and delivery dates','As the Sprint plan','As a replacement for the Product Backlog once the plan for the year is agreed'],[0],'A roadmap shows direction and intended outcomes. Treating it as a fixed promise removes the ability to adapt.'],
 [2,'m','Which TWO are true about the Product Goal? (Choose 2)',['It is a long-term objective for the Scrum Team','It is fulfilled or abandoned before the next one is taken on','It lists all features for the release','It is owned by the Developers'],[0,1],'The Product Goal is a long-term objective, and the team focuses on one at a time.'],
 [2,'s','The Scrum Team learns that the current Product Goal can no longer be reached in a valuable way. What is best?',['Revise or abandon the Product Goal and set a new one','Keep going as planned, since a Product Goal cannot be changed once it has been set','Ask the Developers to work harder and longer until the Product Goal is reached','Hide the news from stakeholders'],[0],'A Product Goal can be abandoned or replaced when evidence shows it no longer serves value.'],
 [2,'s','A roadmap lists exact features with dates twelve months ahead. What is the biggest risk?',['Stakeholders see it as a promise, which creates false certainty','It makes the Product Backlog too short, because every item is already fixed in the roadmap','It stops the Developers from collaborating with each other and with the Product Owner','It violates the Definition of Done'],[0],'Long-range dates and scope create expectations that rarely match reality in complex work.'],

 [3,'s','How does the Scrum Guide describe the Product Backlog?',['An emergent, ordered list of what is needed to improve the product','A fixed specification signed off before the first Sprint','A list of tasks for the current Sprint only, maintained by the Developers','A report of finished work that is updated at the end of every Sprint'],[0],'The Product Backlog is the single source of work for the Scrum Team, and it keeps evolving as the product and market evolve.'],
 [3,'s','Who is accountable for Product Backlog management?',['The Product Owner','The Scrum Master','The Developers','The project manager'],[0],'The PO is accountable, including making items clear, ordering them and ensuring transparency.'],
 [3,'t','The Product Backlog is complete once the first Sprint starts.',null,[1],'False. It is never complete. It emerges and changes as long as the product exists.'],
 [3,'s','What is Product Backlog refinement?',['The ongoing act of adding detail, estimates and order to items','A formal Scrum event with a fixed agenda and a timebox of two hours','A task done only by the Product Owner, without involving the Developers','A one-off activity before Sprint 1'],[0],'Refinement is an ongoing activity, not a formal event. It is usually collaborative between the PO and the Developers.'],
 [3,'m','Which TWO are valid factors when ordering the Product Backlog? (Choose 2)',['Expected value','Dependencies and risk','The order in which stakeholders emailed','Developers’ favorite technologies'],[0,1],'Value, risk, dependencies, urgency and learning drive ordering. Convenience and politics do not.'],
 [3,'s','Which Product Backlog items are typically the most detailed?',['The ones at the top, likely to be worked on soon','The ones at the bottom, because they have been in the backlog the longest','All items equally','Only the items that were requested directly by stakeholders'],[0],'Items at the top are smaller and clearer so they can be done within a Sprint. Items further out can stay rough.'],
 [3,'s','The Product Backlog has 600 items, many of them several years old. What should the PO do?',['Remove or archive items unlikely to create value and keep it lean','Keep everything for traceability, because Scrum does not allow removing items','Ask the Developers to estimate all of the items so the order can be recalculated','Start the next Sprint without looking at it'],[0],'A bloated backlog hides what matters. The PO keeps it transparent and relevant.'],

 [4,'s','Which are the four Key Value Areas of Evidence-Based Management?',['Current Value, Unrealized Value, Time-to-Market, Ability to Innovate','Velocity, Burndown, Scope and Cost, as measured per Sprint','Quality, Speed, Cost and Scope, the classic project triangle','Revenue, Profit, Margin and Growth, the financial measures of the business'],[0],'EBM looks at value today, how much more is possible, how fast you deliver, and how well you can keep innovating.'],
 [4,'s','What does Current Value measure?',['The value the product delivers to customers today','The value that could still be captured','How quickly new features and fixes reach users after they are built','The number of Sprints completed'],[0],'Current Value looks at the value realized right now, e.g. customer satisfaction or revenue per employee.'],
 [4,'s','What does Unrealized Value represent?',['The potential value the product could still deliver if all needs were met','The cost of all work that is started but not yet finished in the Sprint','The number of Product Backlog items that have not yet been refined or started','The Developers’ unused capacity'],[0],'It is the gap between today’s value and the best possible value for customers.'],
 [4,'s','Which Key Value Area is about how quickly the organization can deliver new capabilities and value?',['Time-to-Market','Current Value','Unrealized Value','Ability to Innovate'],[0],'Time-to-Market is about delivery speed, e.g. release frequency and lead time.'],
 [4,'s','Technical debt and defects mostly impact which Key Value Area?',['Ability to Innovate','Current Value','Unrealized Value','Time-to-Market only'],[0],'Ability to Innovate reflects the capacity to deliver new capabilities. Technical debt, defects and delays reduce it.'],
 [4,'t','Velocity is a reliable measure of the value delivered to customers.',null,[1],'False. Velocity is an output measure. Value is about outcomes for customers and the organization.'],
 [4,'m','Which TWO are better indicators of value than output metrics? (Choose 2)',['Customer satisfaction','Actual product usage','Story points completed','Lines of code written'],[0,1],'Outcome measures show whether customers benefit. Story points and code volume only show activity.'],

 [5,'s','Which best describes stakeholders?',['People outside the Scrum Team with a specific interest in or knowledge of the product','Only the customers who pay for the product or service, because they fund the work','The managers of the Developers, who decide on staffing and budgets for the Scrum Team','Anyone who is invited to attend the Daily Scrum or the Sprint Planning'],[0],'Stakeholders can be users, customers, executives, support, legal and more. They are not part of the Scrum Team.'],
 [5,'t','A Product Owner should avoid contact with stakeholders during the Sprint to protect the Developers.',null,[1],'False. Ongoing collaboration with stakeholders is part of the job, and it is how the PO learns what creates value.'],
 [5,'s','Two stakeholders strongly disagree on priorities. What should the Product Owner do?',['Facilitate the conversation, then decide and explain the order transparently','Let the stakeholder with the strongest argument or highest title win','Ask the Scrum Master to choose between them and communicate the result','Split the order 50/50 so that both stakeholders receive an equal share'],[0],'The PO listens to everyone but is the one who decides the order, based on value.'],
 [5,'m','Which TWO are good ways to involve stakeholders? (Choose 2)',['Inviting them to collaborate in the Sprint Review','Regularly talking about the Product Backlog and roadmap','Letting them assign work to Developers','Requiring their sign-off before each Sprint'],[0,1],'Collaboration and transparency are the aim. Stakeholders influence the PO, not the Developers directly.'],
 [5,'s','A customer contacts a Developer and asks for a new feature to be added right now. What is the best reaction?',['Listen kindly, then bring the request to the Product Owner and the Product Backlog','Add it to the Sprint immediately, since the customer is paying for the product','Ignore the customer, because Developers only work from the Sprint Backlog','Ask the customer to email the Scrum Master'],[0],'Input is welcome, but changes to the Product Backlog go through the Product Owner.'],
 [5,'s','A Product Owner spends time with users to understand their problems and needs. Which stance is this?',['Customer Representative','Decision Maker','Leader','Communicator'],[0],'The Customer Representative stance is about being the voice of the customer inside the team.'],
 [5,'s','An executive demands a fixed date and fixed scope for the next year. What is the best PO approach?',['Be transparent about uncertainty and offer forecasts and options based on evidence','Promise it to keep the peace and sort out the details later','Refuse to discuss it because Scrum does not allow any forecasts','Tell them the Developers decide dates and scope, not the Product Owner'],[0],'In complex work, honesty about uncertainty plus frequent delivery builds more trust than fixed promises.'],

 [6,'s','Why release valuable Increments early and often?',['To get real feedback sooner and reduce risk','To save the cost of testing, since users will find the issues','To avoid having to talk to stakeholders about unfinished work','To keep the Sprint Backlog small'],[0],'Frequent releases turn assumptions into evidence quickly.'],
 [6,'t','A hypothesis-driven approach means treating assumptions about customers as things to be tested.',null,[0],'True. Assumptions become hypotheses and are validated with small experiments.'],
 [6,'s','What best describes a minimum viable product (MVP)?',['The smallest thing that lets you learn whether an idea creates value','A low-quality first release that is fixed in later versions','A product with every feature the stakeholders have asked for','A prototype that is only shown to the Developers'],[0],'An MVP is about validated learning, not about cutting quality.'],
 [6,'m','Which TWO are characteristics of a good experiment? (Choose 2)',['It starts from a clear hypothesis','It has measurable success criteria','It guarantees the outcome','It runs for six months before any review'],[0,1],'A good experiment is small, measurable and aimed at learning.'],
 [6,'s','A new feature was released and almost nobody uses it. What should the PO do?',['Treat it as learning, inspect why and adapt the backlog, maybe removing the feature','Blame the Developers for building something nobody wanted','Keep the data to yourself so stakeholders do not lose trust','Build more features like it, because people will eventually discover it'],[0],'Evidence that something isn’t valuable is a useful result.'],
 [6,'s','Which gives the fastest feedback about real customer value?',['Releasing an Increment to actual users','Writing a detailed specification','A long status report sent to all stakeholders each month','An internal approval meeting with management and the Developers'],[0],'Real usage beats opinions and documents.'],
 [6,'t','Delivering many features means a product has delivered a lot of value.',null,[1],'False. Output is not outcome. Many features can still deliver little value.'],

 [7,'s','Which three topics are addressed in Sprint Planning?',['Why, what and how','Who, when and where','Cost, scope and time','Plan, do and check'],[0],'Why is this Sprint valuable (the Sprint Goal), what can be done, and how will the work get done.'],
 [7,'s','Who crafts the Sprint Goal?',['The whole Scrum Team, collaboratively','The Product Owner alone, since the PO owns the product','The Scrum Master alone, since the SM is responsible for Scrum','The stakeholders, who know best what is needed'],[0],'The Sprint Goal is created during Sprint Planning by the Scrum Team.'],
 [7,'s','What is the maximum timebox for Sprint Planning for a one-month Sprint?',['8 hours','4 hours','2 hours','1 day'],[0],'Sprint Planning is at most 8 hours for a one-month Sprint, and usually shorter for shorter Sprints.'],
 [7,'t','During the Sprint, the Developers can change the Sprint Goal if they believe a different one is better.',null,[1],'False. The Sprint Goal does not change during the Sprint. Scope can be clarified and renegotiated with the PO.'],
 [7,'s','Who decides how many Product Backlog items can be done in the Sprint?',['The Developers','The Product Owner','The Scrum Master','The stakeholders'],[0],'Developers forecast what they can do, and the PO proposes what is most valuable.'],
 [7,'m','Which TWO are true about the Sprint Goal? (Choose 2)',['It is a single objective for the Sprint','It is the commitment for the Sprint Backlog','It is written by the PO alone','It lists every item in the Sprint'],[0,1],'A single objective gives focus and coherence, and it is the commitment of the Sprint Backlog.'],
 [7,'s','What is the maximum length of a Sprint?',['One month','Two weeks','Six weeks','There is no limit'],[0],'Sprints are fixed-length events of one month or less.'],

 [8,'s','What is the purpose of the Sprint Review?',['To inspect the outcome of the Sprint and determine future adaptations','To approve the Sprint work formally before it may be released to customers','To report status to management and stakeholders, including a schedule update','To evaluate the Developers’ performance'],[0],'It is a working session where the Scrum Team and stakeholders collaborate on what was done and what to do next.'],
 [8,'t','The Sprint Review should be a one-way demo without discussion.',null,[1],'False. It is a working session. Feedback and adapting the Product Backlog are the point.'],
 [8,'s','What is the purpose of the Sprint Retrospective?',['To plan ways to increase quality and effectiveness','To plan the scope of the next Sprint together with the Product Owner','To show the Increment to stakeholders and collect their feedback','To estimate the items in the Product Backlog for the coming Sprints'],[0],'The Scrum Team inspects how the last Sprint went and identifies improvements.'],
 [8,'s','What is the maximum timebox of a Sprint Retrospective in a one-month Sprint?',['3 hours','1 hour','4 hours','8 hours'],[0],'Three hours for a one-month Sprint, shorter for shorter Sprints.'],
 [8,'s','Who participates in the Sprint Retrospective?',['The Scrum Team','The Scrum Team and all stakeholders','Only the Developers','Only the Scrum Master and Product Owner'],[0],'It is for the Scrum Team: the Product Owner, Scrum Master and Developers.'],
 [8,'s','What is the maximum timebox of a Sprint Review in a one-month Sprint?',['4 hours','2 hours','8 hours','3 hours'],[0],'Four hours for a one-month Sprint, shorter for shorter Sprints.'],

 [9,'s','What is an Increment?',['A concrete stepping stone toward the Product Goal that is usable','A list of features the Developers promised to deliver during the Sprint','A document describing the design and architecture of the product','Work that is still in progress but already visible to stakeholders'],[0],'An Increment is usable and meets the Definition of Done.'],
 [9,'t','An Increment can be delivered to stakeholders before the end of the Sprint.',null,[0],'True. Scrum does not prevent delivery during the Sprint, and the Sprint Review is not a gate for release.'],
 [9,'s','What is the Definition of Done?',['A formal description of the state of the Increment when it meets quality measures','A list of tasks that the Developers must complete in each Sprint','The Product Owner’s acceptance criteria for one individual Product Backlog item','A document for management that shows when the project is finished'],[0],'The Definition of Done is the commitment for the Increment and creates transparency.'],
 [9,'s','There is no organizational Definition of Done. Who creates one?',['The Scrum Team','The Product Owner alone','The Scrum Master alone','The stakeholders'],[0],'If no organizational standard exists, the Scrum Team defines its own.'],
 [9,'s','A Product Backlog item does not meet the Definition of Done at the end of the Sprint. What happens?',['It can’t be released or shown as done, and it returns to the Product Backlog','It is released to customers together with a warning about its status','The Definition of Done is relaxed for that item so that it can be accepted','It automatically becomes part of the next Sprint without any further discussion'],[0],'Only work that meets the Definition of Done is part of the Increment. The rest goes back to the Product Backlog for re-ordering.'],
 [9,'s','Several Scrum Teams work on one product. What applies to the Definition of Done?',['They must all conform to a shared Definition of Done','Each team defines its own so that the teams stay autonomous','The Product Owner decides, and the lowest one of the teams is used','No Definition of Done is needed when the teams share one backlog'],[0],'For one product, the Increment must be integrated and consistent, so the teams share the Definition of Done.'],

 [10,'s','What is the typical size of a Scrum Team?',['10 or fewer people','Exactly 7 people','15 to 20 people','As many as needed'],[0],'Small teams communicate better and are more productive.'],
 [10,'t','Scrum Teams have sub-teams or hierarchies.',null,[1],'False. A Scrum Team is a cohesive unit with no sub-teams or hierarchies.'],
 [10,'s','Who is accountable for creating the Sprint Backlog?',['The Developers','The Product Owner','The Scrum Master','The stakeholders'],[0],'Developers create the plan for the Sprint, the Sprint Backlog.'],
 [10,'s','How does the Scrum Master serve the Product Owner?',['By helping with techniques for Product Goal definition and Product Backlog management','By ordering the Product Backlog when the Product Owner is not available','By deciding what the Developers build and in which order they do it','By representing the stakeholders in the Sprint Planning and Review'],[0],'The Scrum Master helps find techniques, facilitates stakeholder collaboration and helps the team understand the need for clear items.'],
 [10,'s','The Daily Scrum is intended for:',['The Developers, within 15 minutes','The Scrum Master to get status','The Product Owner to assign tasks','The stakeholders to receive reports'],[0],'It is an event for the Developers to inspect progress toward the Sprint Goal, with a 15-minute timebox.'],
 [10,'s','Who is accountable for establishing Scrum as defined in the Scrum Guide?',['The Scrum Master','The Product Owner','The Developers','Management'],[0],'The Scrum Master is accountable for the Scrum Team’s effectiveness and for establishing Scrum.'],

 [11,'s','What are the three pillars of empiricism?',['Transparency, inspection, adaptation','Plan, do, check, act, repeated in every Sprint','Roles, events and artifacts, the three building blocks of Scrum','Speed, quality, cost'],[0],'Scrum is founded on empiricism, supported by these three pillars.'],
 [11,'m','Which THREE are Scrum Values? (Choose 3)',['Courage','Openness','Respect','Speed'],[0,1,2],'The five values are Commitment, Focus, Openness, Respect and Courage. Speed is not one of them.'],
 [11,'s','What does empiricism mean in Scrum?',['Knowledge comes from experience, and decisions are made on what is observed','Everything is planned up front and then executed as precisely as possible','Decisions are made by the highest-ranking person','Only measurable data counts, and experience or feedback is ignored'],[0],'Empiricism favors learning by doing and observing.'],
 [11,'s','What is lean thinking in Scrum about?',['Reducing waste and focusing on the essentials','Working fewer hours so that the team avoids overload','Having smaller teams only, with no more than three people','Removing all documentation to be as fast as possible'],[0],'Lean thinking is about reducing waste and focusing on what matters.'],
 [11,'t','Scrum is a prescriptive methodology with detailed procedures for every situation.',null,[1],'False. Scrum is a purposefully incomplete, lightweight framework.'],
 [11,'s','How does the Scrum Guide describe Scrum?',['A lightweight framework that helps generate value through adaptive solutions for complex problems','A detailed methodology that prescribes the steps for every kind of project and team','A set of engineering practices for writing, testing and releasing software','A reporting tool that gives management a view of progress and cost'],[0],'Scrum is a lightweight framework for complex problems.'],

 [0,'s','Which statement about accountability for product value is correct?',['The Product Owner is accountable for maximizing value, even when others help','Value is a shared responsibility with no single accountable person','The Scrum Master answers for value and the Product Owner for the schedule','The Developers are accountable for value and the Product Owner for the budget'],[0],'The Product Owner is accountable for maximizing the value of the product. The whole Scrum Team contributes, but the accountability is the PO’s.'],
 [0,'t','A committee of three managers can jointly act as the Product Owner of a Scrum Team.',null,[1],'False. The Product Owner is one person. A committee can influence the PO, but the PO makes the decisions.'],
 [0,'m','Which TWO are part of the Product Owner’s work on the Product Backlog? (Choose 2)',['Creating and clearly communicating Product Backlog items','Ensuring the Product Backlog is transparent and understood','Writing the Sprint Backlog tasks','Approving every technical design decision'],[0,1],'The PO creates and communicates items and keeps the backlog transparent. Developers plan their own tasks and make technical decisions.'],
 [0,'s','The Product Owner asks a Developer to help write Product Backlog items. Is that allowed?',['Yes, the PO can delegate the work but remains accountable','No, only the PO may write Product Backlog items','Yes, and the Developer then becomes accountable for the items','No, unless the Scrum Master approves'],[0],'The Product Owner may do the work or delegate it, but stays accountable.'],
 [0,'s','A PO tests a new onboarding flow with 50 customers before building it fully. Which stance is shown?',['Experimenter','Decision Maker','Influencer','Visionary'],[0],'Testing a hypothesis with a small, safe experiment is the Experimenter stance.'],
 [0,'s','A Developer thinks the ordering is wrong and wants to reorder the Product Backlog personally. What is true?',['Developers can give input, but the PO decides the order','The Developers decide the order because they know the work best','The Scrum Master settles the dispute','The order is decided by majority vote'],[0],'The PO is accountable for ordering the Product Backlog. Input is welcome, but the decision stays with the PO.'],
 [0,'s','The Sprint Goal became obsolete because the company changed direction. Who may cancel the Sprint?',['Only the Product Owner','The Scrum Master after consulting the CEO','The Developers, by consensus','Any stakeholder who notices'],[0],'Only the Product Owner can cancel a Sprint.'],

 [1,'s','Which best answers the question: “Why does our product exist and where is it heading?”',['The product vision','The Definition of Done','The Sprint Backlog','The velocity trend'],[0],'The product vision describes the purpose and desired future of the product.'],
 [1,'s','Two teams share a vision. One plans to win with low prices, the other with superior quality. What does this difference describe?',['Different product strategies','Different Sprint Goals','Different Definitions of Done','Different Scrum Masters'],[0],'Strategy is the approach to reach the vision, including how to stand out.'],
 [1,'t','Stakeholders and the Scrum Team should be able to explain the product vision in their own words.',null,[0],'True. A shared vision is understood and owned beyond the Product Owner.'],
 [1,'m','Which TWO are signs that a product vision is working? (Choose 2)',['People in the Scrum Team can explain it and use it to make decisions','Stakeholders can see how new backlog items connect to it','Only the executive team knows it','It is rewritten after every Sprint Review regardless of evidence'],[0,1],'A working vision is understood and used to guide choices. Secrecy or constant rewriting makes it useless.'],
 [1,'s','Customer research shows the target audience has moved to another platform, while the vision still describes the old one. What now?',['Re-examine the vision and strategy, then adapt the Product Goal and backlog','Keep the vision and wait for customers to return','Let the Developers decide the new direction, since they know the technology','Wait until the next release before reacting to the new situation'],[0],'When evidence changes the picture, the vision and strategy are inspected and adapted.'],
 [1,'s','Which is the strongest sign of an unclear product strategy?',['Nobody can explain who the product is for or what makes it different','The Product Backlog is ordered by the Product Owner every Sprint','Sprints have a fixed length of one month or less','The Daily Scrum takes 15 minutes every working day'],[0],'A clear strategy answers who the product is for and how it stands out.'],
 [1,'t','A product vision is a plan with tasks and dates.',null,[1],'False. It describes purpose and a desired future, not tasks and dates.'],

 [2,'s','Where does a Scrum Team make its long-term objective transparent?',['In the Product Backlog, as its commitment (the Product Goal)','In the Sprint Backlog, where the Developers plan the work','In the Definition of Done, as the Increment’s quality bar','In the invitation that is sent for the Sprint Review'],[0],'The Product Goal is the commitment for the Product Backlog.'],
 [2,'s','A Scrum Team reached its Product Goal. What is the right next step regarding goals?',['Set the next Product Goal, working toward one at a time','Run several Product Goals in parallel from now on','Wait for stakeholders to define a Sprint Goal','Close the Product Backlog and disband the Scrum Team'],[0],'The Scrum Team works toward one Product Goal at a time and picks the next one when the current one is fulfilled or abandoned.'],
 [2,'t','The Product Goal gives the Scrum Team a target to plan against.',null,[0],'True. It describes a future state of the product that the team plans toward.'],
 [2,'s','Stakeholders ask for a roadmap. Which approach fits Scrum best?',['Share a roadmap of goals and outcomes that is updated as the team learns','Commit to features and dates for the next 18 months','Refuse, since Scrum does not allow any plans beyond the current Sprint','Let the Developers write it without the PO'],[0],'A roadmap is a flexible view of direction and outcomes, not a fixed commitment.'],
 [2,'m','Which TWO describe how a Product Goal relates to Sprints? (Choose 2)',['Sprints are steps toward the Product Goal','Sprint Goals should contribute toward it','Every Sprint must achieve the entire Product Goal','The Product Goal changes every Sprint'],[0,1],'The Product Goal is long-term. Each Sprint and its Sprint Goal moves the team closer to it.'],
 [2,'s','After several Sprints the data shows nobody wants what the Product Goal describes. What should the PO do?',['Be transparent and consider abandoning or replacing the Product Goal','Add more features to the same goal until customers start using them','Cancel the Scrum Team and start again with a new group of people','Wait for the Scrum Master’s decision'],[0],'A Product Goal can be abandoned or replaced when evidence says it no longer serves value.'],
 [2,'s','Why is a detailed 12-month feature roadmap with dates risky in complex work?',['Reality changes, and stakeholders may treat it as a guarantee','It violates the Scrum Guide’s timeboxes','Developers cannot read roadmaps that contain dates, which confuses them','It makes the Sprint Goal unnecessary'],[0],'In complex work, long-range dates and scope create expectations that rarely hold.'],

 [3,'s','Which statement about the Product Backlog is correct?',['It is the single source of work and keeps changing as the product evolves','It is fixed once the stakeholders have approved it at the start','It contains only the work of the current Sprint','It is owned and maintained by the Scrum Master for the team'],[0],'The Product Backlog is emergent and is the single source of work for the Scrum Team.'],
 [3,'s','Who answers for the transparency, ordering and clarity of the Product Backlog?',['The Product Owner','The Developers collectively','The Scrum Master','The stakeholder who requested the items'],[0],'The Product Owner is accountable for Product Backlog management.'],
 [3,'t','New items can still be added to the Product Backlog during a Sprint.',null,[0],'True. The Product Backlog is emergent and can change at any time. It is the Sprint Goal that is protected during the Sprint.'],
 [3,'s','Developers and the Product Owner spend part of the Sprint clarifying and sizing upcoming items. What is this?',['Product Backlog refinement, an ongoing activity','Sprint Planning part two, which is held in the middle of the Sprint','A mandatory event in the Scrum Guide','Sprint Review preparation, which is a mandatory part of the Review'],[0],'Refinement is an ongoing activity, not a formal event.'],
 [3,'m','Which TWO are reasonable reasons to move an item up the Product Backlog? (Choose 2)',['Customer feedback shows its value is higher than expected','Another high-value item depends on it','A stakeholder with a high job title asked for it','It was the first item that was added'],[0,1],'Value, dependencies, risk and learning drive ordering, not hierarchy or age.'],
 [3,'s','Developers can’t start an item at the top of the Product Backlog because it is too vague. What went wrong?',['Items near the top should be refined enough to be done within a Sprint','Nothing went wrong, because top items should stay vague until the Sprint starts','The Scrum Master failed to order the Product Backlog correctly','The stakeholders did not approve the item before the Sprint began'],[0],'Items at the top should be clear and small enough to be done in a Sprint.'],
 [3,'s','A new PO inherits a Product Backlog with 400 outdated items. What is a sensible first move?',['Clean it up so it reflects the current goal, removing what no longer adds value','Ask the Developers to refine all 400 items','Cancel the Product Goal and start a new Product Backlog from scratch','Keep it unchanged for traceability'],[0],'A lean, relevant backlog keeps the work transparent.'],

 [4,'s','Which is NOT one of the four Key Value Areas of Evidence-Based Management?',['Team Velocity','Current Value','Time-to-Market','Ability to Innovate'],[0],'The four areas are Current Value, Unrealized Value, Time-to-Market and Ability to Innovate. Velocity is an output measure.'],
 [4,'s','Customer satisfaction and revenue per employee are examples of metrics for which Key Value Area?',['Current Value','Unrealized Value','Time-to-Market','Ability to Innovate'],[0],'Current Value covers the value realized today.'],
 [4,'s','The gap between how customers experience the product today and the best possible experience is called…',['Unrealized Value','Current Value','Technical debt','Time-to-Market'],[0],'Unrealized Value is the potential value not yet captured.'],
 [4,'s','Release frequency and lead time are typical measures of which Key Value Area?',['Time-to-Market','Current Value','Unrealized Value','Ability to Innovate'],[0],'Time-to-Market is about how quickly new value can be delivered.'],
 [4,'s','A growing number of defects and a slow build pipeline mostly reduce which Key Value Area?',['Ability to Innovate','Current Value','Unrealized Value','None of them'],[0],'Ability to Innovate is the capacity to deliver new capabilities, which defects and slow pipelines reduce.'],
 [4,'t','A team that doubles its velocity proves customers receive twice as much value.',null,[1],'False. Velocity measures output, not the value customers experience.'],
 [4,'m','Which TWO are examples of outcome-based measures? (Choose 2)',['Customer retention','Time customers need to complete a key task','Number of tickets closed','Number of features shipped'],[0,1],'Outcome measures reflect results for customers. Tickets and features are output.'],

 [5,'s','A legal advisor, an end user and a sales director care about the product but are not on the Scrum Team. What are they?',['Stakeholders','Developers','Product Owners','Scrum Masters'],[0],'Stakeholders are people outside the Scrum Team with an interest in or knowledge of the product.'],
 [5,'t','The Product Owner should regularly talk to users and stakeholders, also between Sprint Reviews.',null,[0],'True. Ongoing collaboration is how the PO learns what creates value.'],
 [5,'s','Sales wants feature A first and support wants feature B first. Both are senior. What does the PO do?',['Gather their reasoning, weigh the value, decide, and explain the decision','Choose A because sales brings revenue','Let the Developers pick the one they find the most interesting','Put both in the Sprint regardless of capacity'],[0],'The PO listens to everyone and decides based on value, while staying transparent.'],
 [5,'m','Which TWO help the Scrum Team collaborate well with stakeholders? (Choose 2)',['Making the Product Backlog transparent to them','Inviting them to give feedback on the Increment','Giving them direct control over the Developers’ daily work','Hiding unfinished work until it is perfect'],[0,1],'Transparency and feedback loops build trust. Stakeholders influence the PO, not the Developers’ daily work.'],
 [5,'s','A stakeholder insists that a Developer add a feature this Sprint. Who decides whether it enters the Product Backlog and where?',['The Product Owner','The Developer who was asked','The Scrum Master','The stakeholder'],[0],'Changes to the Product Backlog and its order are decided by the Product Owner.'],
 [5,'s','A PO regularly shadows customers using the product and brings their pain points to the team. Which stance is this?',['Customer Representative','Visionary','Experimenter','Decision Maker'],[0],'Bringing the voice of the customer into the team is the Customer Representative stance.'],
 [5,'s','A VP wants a commitment to all features by a fixed date. Which response builds the most trust?',['Explain what is known, give a forecast with uncertainty and show progress each Sprint','Say yes, promise the date and plan overtime to make sure it happens','Say no firmly and avoid the topic in future discussions','Give a date, because stakeholders need certainty, without discussing scope'],[0],'Honesty about uncertainty plus frequent evidence of progress builds trust.'],

 [6,'s','A PO can perfect the product for six months or release a small valuable Increment now. Which better supports empiricism?',['Releasing a small Increment to learn from real use','Perfecting it first so that customers only see a finished product','Waiting until next quarter to see how the market develops','Releasing it internally only, to collect opinions from colleagues'],[0],'Empiricism relies on real feedback, so small early releases win.'],
 [6,'t','Assumptions about what customers want are facts until proven wrong.',null,[1],'False. They are hypotheses until validated.'],
 [6,'s','What is the main goal of releasing an MVP?',['Learn quickly whether the idea creates value','Impress stakeholders with a polished demo','Finish all planned features','Reduce testing and quality work to save time'],[0],'An MVP is a vehicle for validated learning.'],
 [6,'m','Which TWO help a PO decide whether an experiment worked? (Choose 2)',['A measurable outcome defined before the experiment','Evidence from real customer behavior','The Developers’ opinion alone','The number of tasks completed'],[0,1],'Define success up front and judge it by real behavior.'],
 [6,'s','Analytics show customers abandon a new checkout step. What is the best reaction?',['Use the evidence to adapt the Product Backlog and try another approach','Keep it unchanged since it was planned and approved','Blame the Developers for building a poor checkout step','Wait for the quarterly report before deciding what to change'],[0],'Evidence is input for adaptation.'],
 [6,'s','Which approach gives the most reliable evidence of customer value?',['Observing real customers use a released Increment','Asking internal managers for their opinion','Writing a detailed business case with revenue forecasts','Using the Developers’ estimates of how much value each item has'],[0],'Real usage beats opinions and forecasts.'],
 [6,'t','Output measures like features delivered show whether customers benefit.',null,[1],'False. Output is not outcome. Customers may not benefit from what was built.'],

 [7,'s','Sprint Planning answers which questions?',['Why is the Sprint valuable, what can be done and how will the work get done','Who is late, what is blocked and who is next','What went well, what didn’t and what to change','Is the Definition of Done met, who approves and when to release'],[0],'The three topics are why, what and how.'],
 [7,'s','Who must collaborate to craft the Sprint Goal in Sprint Planning?',['The entire Scrum Team','Only the Developers','Only the Product Owner and stakeholders','Only the Scrum Master'],[0],'The Scrum Team crafts the Sprint Goal together.'],

const freshProg=()=>({q:{},th:{},best:0,xp:0,ex:[],day:{d:'',n:0},ds:0,dl:''});
let prog=Object.assign(freshProg(),store.get(K.prog,{}));

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const wpick=(items,ws)=>{let r=Math.random()*ws.reduce((a,b)=>a+b,0);for(let i=0;i<items.length;i++){r-=ws[i];if(r<=0)return items[i]}return items[items.length-1]};

function strength(t){const a=(prog.th[t]||[]).slice(-15);return (a.reduce((x,y)=>x+y,0)+1)/(a.length+2)}
function weakestThemes(n){
  const withData=THEMES.map((_,i)=>i).filter(t=>(prog.th[t]||[]).length>=3);
  if(!withData.length)return null;
  return withData.sort((a,b)=>strength(a)-strength(b)).slice(0,n);
}
const GOAL=10;
const dstr=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>dstr(new Date());
const yesterday=()=>{const y=new Date();y.setDate(y.getDate()-1);return dstr(y)};
function bumpDay(n){
  const t=today();
  if(prog.day.d!==t)prog.day={d:t,n:0};
  const before=prog.day.n;prog.day.n+=n;
  if(before<GOAL&&prog.day.n>=GOAL){prog.ds=prog.dl===yesterday()?prog.ds+1:1;prog.dl=t;return true}
  return false;
}
const dayStreak=()=>(prog.dl===today()||prog.dl===yesterday())?prog.ds:0;
function understood(){let n=0;for(let g=0;g<HALF;g++){const a=prog.q[g],b=prog.q[g+HALF];if(a&&b&&a.last===1&&b.last===1)n++}return n}
function readiness(){
  const answered=Object.values(prog.q).reduce((a,p)=>a+p.seen,0);
  if(answered<15)return null;
  const ss=THEMES.map((_,t)=>{const a=(prog.th[t]||[]).slice(-15),c=a.reduce((x,y)=>x+y,0);return {t,s:c/Math.max(a.length,10),n:a.length}});
  const avg=ss.reduce((a,x)=>a+x.s,0)/ss.length;
  const mn=Math.min(...ss.map(x=>x.s));
  const u=understood();
  const score=Math.round(100*(0.45*avg+0.25*mn+0.30*u/HALF));
  const wk=ss.filter(x=>x.n>=3).sort((a,b)=>a.s-b.s)[0];
  const ready=score>=85&&mn>=0.75;
  return {score,ready,u,label:ready?'Ready for exam mode 🚀':score>=65?'Getting close 🌤️':'Not yet 🌱',weak:wk?wk.t:null,fresh:ss.filter(x=>x.n<10).length};
}

/* ---------- selection logic ---------- */
function pickNext(r){
  const due=Object.keys(r.due).filter(id=>r.due[id]<=0).map(Number);
  while(due.length){
    const id=due.shift();delete r.due[id];
    if(!r.asked.includes(id))return id;
    const t=twin(id);
    if(!r.asked.includes(t)){r.tw[t]=true;return t}
  }
  const all=THEMES.map((_,i)=>i);
  const ok=i=>!VARS[concept(i)].some(v=>r.asked.includes(v));
  const avail=t=>Q.some((q,i)=>q[0]===t&&ok(i));
  const cap=Math.max(2,Math.ceil(r.total*0.4));
  const counts={};r.log.forEach(l=>{counts[l.t]=(counts[l.t]||0)+1});
  const pool=r.themes&&r.themes.length?r.themes:all;
  let cands=pool.filter(t=>avail(t)&&(counts[t]||0)<cap);
  if(!cands.length)cands=pool.filter(avail);
  if(!cands.length)cands=all.filter(avail);
  if(!cands.length)return null;
  const ws=cands.map(t=>r.weak?0.1+Math.pow(1-strength(t),2)*2.2:0.15+(1-strength(t))*1.2);
  const t=wpick(cands,ws);
  const ids=Q.map((_,i)=>i).filter(i=>Q[i][0]===t&&ok(i));
  const qw=ids.map(i=>{const p=prog.q[i];if(!p||!p.seen)return 3;let w=[3,5,3.5,2,1.2,.8][p.box]||1;if(p.streak>=2)w=Math.min(w,1);return w});
  return wpick(ids,qw);
}

/* ---------- round flow ---------- */
const MAXL=3;
function examOrder(){
  const ids=[];
  for(let g=0;g<HALF;g++){
    const v=VARS[g],seen=v.map(i=>prog.q[i]?prog.q[i].seen:0),m=Math.min(...seen);
    ids.push(pick1(v.filter((_,k)=>seen[k]===m)));
  }
  return shuffle(ids);
}
function startRound(mode,themes){
  const r={mode,total:mode==='exam'?80:settings.count,log:[],asked:[],due:{},tw:{},themes:themes||null,weak:mode==='weak',streak:0,best:0,conq:0,lucky:0,solid:0,lives:MAXL,t0:Date.now()};
  if(mode==='exam'){r.order=examOrder();r.ans={};r.flag={};r.ord={};r.i=0;r.endsAt=r.t0+3600*1000}
  round=r;summary=null;view='quiz';showOver=false;
  if(mode==='exam'){save();render();window.scrollTo(0,0);startTimer()}else present();
}
function present(){
  const r=round;
  const id=pickNext(r);
  if(id==null){finish();return}
  const q=Q[id],p=qp(id);
  const n=optsOf(q).length;
  const order=q[1]==='t'?[0,1]:shuffle([...Array(n).keys()]);
  const had=p.misses>0&&p.streak<2;
  r.cur={id,order,sel:[],done:false,ok:null,ev:null,had,twist:!!r.tw[id],taunt:had?pick1(TAUNTS[Math.min(3,p.misses-1)]):''};
  if(!r.asked.includes(id))r.asked.push(id);
  save();render();window.scrollTo(0,0);
}
function record(){
  const r=round,c=r.cur,q=Q[c.id],p=qp(c.id),t=q[0];
  const ok=sameSet(c.sel,q[4]);
  c.ok=ok;c.done=true;c.life=false;
  const oldStage=stageOf(p);
  const tid=twin(c.id),tp=prog.q[tid];
  p.seen++;p.tries++;p.last=ok?1:0;
  let ev=null;
  if(ok){
    p.streak++;p.box=Math.min(5,p.box+1);r.streak++;
    r.best=Math.max(r.best,r.streak);prog.best=Math.max(prog.best,r.streak);prog.xp+=10;
    if(p.misses>0){
      if(p.streak===2){ev={k:'defeated',tries:p.tries};p.won=true;r.conq++;prog.xp+=10}
      else if(p.streak<2)ev={k:'progress'};
    }
    if(p.streak>=2)delete r.due[c.id];else if(p.misses>0)r.due[c.id]=3;
    if(r.streak%5===0&&r.lives<MAXL){r.lives++;c.life=true}
  }else{
    p.streak=0;p.box=1;p.misses++;r.streak=0;r.lives--;
    ev={k:p.misses===1?'appear':'evolve',from:oldStage,to:stageOf(p)};r.due[c.id]=2;
  }
  /* understanding check against the twin (same idea, different wording) */
  c.tw=null;
  if(tp&&tp.seen>0){
    if(ok&&tp.last===1){c.tw='solid';r.solid++}
    else if(!ok&&tp.last===1){c.tw='lucky';r.lucky++}
    else if(ok&&tp.last===0)c.tw='both';
  }
  Object.keys(r.due).forEach(k=>{if(+k!==c.id)r.due[k]--});
  if(ok&&!r.asked.includes(tid)&&r.due[tid]==null&&!(tp&&tp.last===1)&&r.total-r.log.length>4){r.due[tid]=3;r.tw[tid]=true}
  prog.th[t]=((prog.th[t]||[]).concat(ok?1:0)).slice(-15);
  r.log.push({id:c.id,t,ok,sel:c.sel.slice()});
  c.ev=ev;c.over=r.lives<=0;
  const goal=bumpDay(1);
  if(ok){
    beep([[660,0,.12],[880,.1,.16]]);haptic(15);
    if(c.life)toast('❤️ Life won back!');
    else if(goal)toast('📅 Daily goal reached!');
    else if(r.streak>=3&&r.streak%3===0)toast('🔥 '+r.streak+' in a row!');
  }else beep([[330,0,.2]]);
  save();
}
function submitExam(){
  const r=round;if(!r||r.mode!=='exam')return;
  stopTimer();
  let answered=0;
  r.order.forEach((id,i)=>{
    const q=Q[id],p=qp(id),sel=r.ans[i]||[],ok=sameSet(sel,q[4]);
    if(sel.length)answered++;
    p.seen++;p.tries++;p.last=ok?1:0;
    if(ok){p.streak++;p.box=Math.min(5,p.box+1)}else{p.streak=0;p.box=1;p.misses++}
    prog.th[q[0]]=((prog.th[q[0]]||[]).concat(ok?1:0)).slice(-15);
    r.log.push({id,t:q[0],ok,sel,skipped:!sel.length});
  });
  const c=r.log.filter(l=>l.ok).length;
  prog.ex=(prog.ex||[]).concat({p:Math.round(c/r.log.length*100),d:today()}).slice(-5);
  prog.xp+=c*5;bumpDay(answered);
  finishWith({mode:'exam',exam:true,log:r.log.slice(),best:0,conq:0,over:false,lucky:0,solid:0});
}
function finish(over){
  const r=round;if(!r)return;
  stopTimer();
  finishWith({mode:r.mode,exam:false,log:r.log.slice(),best:r.best,conq:r.conq,over:!!over,lucky:r.lucky,solid:r.solid});
}
function finishWith(S){
  summary=S;round=null;view='summary';showOver=false;ringAnim=true;
  save();render();window.scrollTo(0,0);celebrate();
}

/* ---------- timer ---------- */
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
const examLeft=()=>Math.max(0,Math.round((round.endsAt-Date.now())/1000));
function paceText(){
  const r=round,answered=r.order.filter((_,i)=>(r.ans[i]||[]).length).length;
  const used=(Date.now()-r.t0)/3600000;
  if(used<.08)return '';
  return answered/80>=used-.05?'On pace ✅':'Speed up ⚡';
}
function startTimer(){stopTimer();timer=setInterval(tick,1000);tick()}
function stopTimer(){if(timer){clearInterval(timer);timer=null}}
function tick(){
  if(!round||round.mode!=='exam'){stopTimer();return}
  const left=examLeft();
  const el=$('#tm');if(el)el.textContent='⏱ '+fmt(left);
  const pe=$('#pace');if(pe)pe.textContent=paceText();
  if(left<=0){stopTimer();submitExam()}
}

/* ---------- feedback helpers ---------- */
let ac=null;
function beep(seq){
  if(!settings.sound)return;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    seq.forEach(([f,t,d])=>{
      const o=ac.createOscillator(),g=ac.createGain(),s=ac.currentTime+t;
      o.type='triangle';o.frequency.value=f;
      g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(.12,s+.02);g.gain.exponentialRampToValueAtTime(.0001,s+d);
      o.connect(g);g.connect(ac.destination);o.start(s);o.stop(s+d+.05);
    });
  }catch(e){}
}
function haptic(p){try{if(navigator.vibrate)navigator.vibrate(p)}catch(e){}}
function toast(t){
  const old=$('.toast');if(old)old.remove();
  const d=document.createElement('div');d.className='toast';d.textContent=t;d.setAttribute('role','status');
  document.body.appendChild(d);setTimeout(()=>d.remove(),1700);
}
function confetti(emojis,count){
  if(reduce)return;
  const box=document.createElement('div');box.className='confetti';box.setAttribute('aria-hidden','true');
  for(let i=0;i<count;i++){
    const s=document.createElement('span');
    s.textContent=pick1(emojis);
    const dur=2.6+Math.random()*2.4;
    s.style.cssText='left:'+(Math.random()*100)+'%;font-size:'+(18+Math.random()*22)+'px;animation-duration:'+dur+'s;animation-delay:'+(Math.random()*1.4)+'s;--dx:'+((Math.random()-.5)*160)+'px;--rot:'+((Math.random()-.5)*720)+'deg';
    box.appendChild(s);
  }
  document.body.appendChild(box);
  setTimeout(()=>box.remove(),7500);
}
function calc(){
  const S=summary,total=S.log.length,correct=S.log.filter(l=>l.ok).length;
  const pct=total?Math.round(correct/total*100):0;
  const PASS=settings.pass;
  const tier=pct===100?'perfect':pct>=PASS?'pass':pct>=PASS-10?'close':'not';
  const by={};S.log.forEach(l=>{const b=by[l.t]||(by[l.t]={t:l.t,n:0,c:0});b.n++;if(l.ok)b.c++});
  const th=Object.values(by).map(b=>Object.assign(b,{pct:Math.round(b.c/b.n*100)}));
  return {total,correct,pct,PASS,tier,th};
}
function celebrate(){
  const C=calc();
  if(C.tier==='not'||summary.over)return;
  if(C.tier==='close'){confetti(['✨','💪','⭐'],26);haptic(30);return}
  haptic([80,40,80,40,160]);
  beep([[523,0,.18],[659,.16,.18],[784,.32,.18],[1047,.5,.4]]);
  confetti(C.tier==='perfect'?['🎉','🥳','✨','🏆','🎊','👑']:['🎉','🥳','✨','🏆','🎊'],C.tier==='perfect'?120:80);
}

const qhtml=t=>esc(t).replace(/\b(NOT|FALSE|INCORRECT)\b/g,'<b>$1</b>');
function optionsHtml(q,order,sel,done,feedback){
  const multi=q[1]==='m';
  return order.map((real,i)=>{
    const on=sel.includes(real),good=q[4].includes(real);
    let cls='opt',mk='';
    if(done&&feedback){
      if(good){cls+=' ok';mk='✓'}else if(on){cls+=' miss';mk='✗'}else cls+=' dim';
    }else if(on){cls+=' sel';mk=multi?'✓':'●'}
    return '<button class="'+cls+'" data-a="pick" data-i="'+i+'"'+(multi?' aria-pressed="'+on+'"':'')+(done&&feedback?' disabled':'')+'><span class="mk '+(multi?'c':'r')+'" aria-hidden="true">'+mk+'</span><span>'+esc(optsOf(q)[real])+'</span></button>';
  }).join('');
}

function ordFor(r,i){
  if(!r.ord[i]){const q=Q[r.order[i]];r.ord[i]=q[1]==='t'?[0,1]:shuffle([...Array(optsOf(q).length).keys()])}
  return r.ord[i];
}
