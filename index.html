function overviewSheet(){
  const r=round;
  const un=r.order.filter((_,k)=>!(r.ans[k]||[]).length).length;
  const fl=Object.keys(r.flag).filter(k=>r.flag[k]).length;
  let h='<div class="scrim" data-a="scrim"><div class="panel" role="dialog" aria-label="Exam overview"><div class="row" style="align-items:center"><h2>Overview</h2><button class="iconbtn" data-a="close" aria-label="Close" style="flex:none;margin-left:auto">✕</button></div>';
  h+='<div class="muted small">Tap a number to jump there. Filled means answered, 🚩 means flagged.</div><div class="grid">';
  for(let k=0;k<80;k++){
    const a=(r.ans[k]||[]).length;
    h+='<button class="gq'+(a?' a':'')+(r.flag[k]?' f':'')+(k===r.i?' cur':'')+'" data-a="goto" data-i="'+k+'" aria-label="Question '+(k+1)+(a?', answered':', not answered')+(r.flag[k]?', flagged':'')+'">'+(k+1)+'</button>';
  }
  h+='</div><div class="small" style="margin-bottom:12px"><b>'+un+'</b> unanswered · <b>'+fl+'</b> flagged · '+fmt(examLeft())+' left</div><button class="btn sun" data-a="submit">Submit exam 🏁</button><button class="btn alt" data-a="close" style="margin-top:10px">Keep working</button></div></div>';
  return h;
}
function cheatSheet(){
  const T=THEMES[cheat];
  return '<div class="scrim" data-a="scrim"><div class="panel cheat" role="dialog" aria-label="Cheat sheet"><div class="row" style="align-items:center"><h2>'+T.e+' '+esc(T.n)+'</h2><button class="iconbtn" data-a="close" aria-label="Close" style="flex:none;margin-left:auto">✕</button></div><ul style="padding-left:20px;margin:12px 0">'+CHEAT[cheat].map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul><div class="muted small">Go deeper: '+esc(T.r)+'</div></div></div>';
}

function summaryView(){
  const S=summary,C=calc(),over=!!S.over;
  const {pct,PASS,tier,total,correct}=C;
  const circ=2*Math.PI*54;
  const ang=PASS/100*2*Math.PI-Math.PI/2;
  const x1=70+46*Math.cos(ang),y1=70+46*Math.sin(ang),x2=70+64*Math.cos(ang),y2=70+64*Math.sin(ang);
  const need=Math.ceil(PASS*80/100);
  const head=over?'Out of lives 💔':{perfect:'Flawless! 👑',pass:'You passed! 🎓',close:'So close! 💪',not:'Keep going, you’re getting there 🌱'}[tier];
  let sub;
  if(over)sub='You made it through '+total+' question'+(total===1?'':'s')+'. Missed ones come back until they stick, so go again!';
  else if(tier==='perfect'||tier==='pass')sub='That clears the '+PASS+'% pass line.';
  else sub=(PASS-pct)+'% to go to reach the '+PASS+'% pass line.';
  const label=S.exam?'Exam result':over?'Round over':'Round result';
  const note=S.exam?'The real exam needs about '+need+' of 80 correct ('+PASS+'%).':'Short rounds are a guide. The real pass or fail check is exam mode with 80 questions.';
  let h=topbar('Results','<button class="iconbtn" data-a="home" aria-label="Home">🏠</button>');
  h+='<div class="card sum"><span class="tag">'+label+'</span>';
  if(!over&&(tier==='perfect'||tier==='pass'))h+='<div class="trophy" aria-hidden="true">🏆</div>';
  h+='<div class="ringwrap"><svg class="ring" viewBox="0 0 140 140" role="img" aria-label="'+pct+' percent, pass line '+PASS+' percent"><circle class="trk" cx="70" cy="70" r="54"/><circle class="prg" id="ringp" cx="70" cy="70" r="54" stroke-dasharray="'+circ+'" stroke-dashoffset="'+circ+'" transform="rotate(-90 70 70)"/><line class="pass" x1="'+x1.toFixed(1)+'" y1="'+y1.toFixed(1)+'" x2="'+x2.toFixed(1)+'" y2="'+y2.toFixed(1)+'"/></svg><div class="ringtxt"><b>'+pct+'%</b><span>'+correct+' / '+total+'</span></div></div>';
  h+='<h2 class="verdict">'+head+'</h2><div>'+sub+'</div><div class="muted small" style="margin-top:6px">The yellow tick on the ring marks the pass line. '+note+'</div>';
  const won=[];Object.keys(prog.q).forEach(i=>{if(prog.q[i].won)won.push(stageOf(prog.q[i]))});
  if(!over&&(tier==='pass'||tier==='perfect')&&won.length)h+='<div class="parade" aria-label="Your defeated creatures cheer"><div>'+won.slice(0,8).join(' ')+' 📣</div></div>';
  if(S.solid||S.lucky)h+='<div class="small" style="margin-top:10px">🎯 Understood from both angles: <b>'+(S.solid||0)+'</b> · 🍀 Possible lucky guesses: <b>'+(S.lucky||0)+'</b></div>';
  h+='<div class="row" style="margin-top:12px"><div class="stat"><b>🔥 '+S.best+'</b><span>best streak</span></div><div class="stat"><b>💥 '+S.conq+'</b><span>defeated</span></div></div></div>';

  const enough=C.th.filter(t=>t.n>=3).sort((a,b)=>a.pct-b.pct);
  const few=C.th.filter(t=>t.n<3);
  h+='<div class="card"><h2>Score by theme</h2>';
  enough.forEach(t=>{
    h+='<div class="brow"><div class="hd"><span>'+THEMES[t.t].e+' '+esc(THEMES[t.t].n)+'</span><span>'+t.pct+'% <span class="muted">('+t.c+'/'+t.n+')</span></span></div><div class="pbar"><i class="'+(t.pct>=PASS?'p':'')+'" style="width:'+t.pct+'%"></i><u style="left:calc('+PASS+'% - 1px)"></u></div></div>';
  });
  if(!enough.length)h+='<div class="muted">Not enough answers per theme yet. Try a longer round to see theme percentages.</div>';
  if(few.length)h+='<div class="muted small" style="margin-top:10px">Not enough data yet: '+few.map(t=>THEMES[t.t].e+' '+esc(THEMES[t.t].n)).join(', ')+'.</div>';
  h+='</div>';

  const weak=enough.filter(t=>t.pct<PASS).slice(0,3);
  h+='<div class="card focus"><h2>Focus on these 🎯</h2>';
  if(weak.length){
    h+='<ul class="plain">'+weak.map(t=>'<li><b>'+THEMES[t.t].e+' '+esc(THEMES[t.t].n)+'</b> · '+t.pct+'%<div class="muted small">Reread: '+esc(THEMES[t.t].r)+'</div><button class="flagbtn" style="margin-top:6px" data-a="cheat" data-t="'+t.t+'">📝 Cheat sheet</button></li>').join('')+'</ul><div class="muted small" style="margin-top:8px">These themes will show up more often in your next rounds.</div>';
  }else h+='<div>Nothing below the pass line in this round 🌱 Keep rotating themes to stay sharp.</div>';
  h+='</div>';

  const missed=S.log.filter(l=>!l.ok);
  if(missed.length){
    h+='<div class="card"><details><summary>Review missed questions ('+missed.length+')</summary>'+missed.map(l=>{
      const q=Q[l.id];
      return '<div class="miss-i"><b>'+esc(q[2])+'</b><div>Answer: '+esc(q[4].map(i=>optsOf(q)[i]).join(' / '))+'</div><div class="muted">'+esc(q[5])+'</div></div>';
    }).join('')+'</details></div>';
  }
  h+='<div class="row"><button class="btn" data-a="weakend">Practice weak themes 🔥</button><button class="btn alt" data-a="'+(S.exam?'exam':'start')+'">'+(S.exam?'Another exam':'Play again')+'</button></div>';
  return h;
}

function settingsSheet(){
  let h='<div class="scrim" data-a="scrim"><div class="panel" role="dialog" aria-label="Settings"><div class="row" style="align-items:center"><h2>Settings</h2><button class="iconbtn" data-a="close" aria-label="Close" style="flex:none;margin-left:auto">✕</button></div>';
  h+='<div class="srow"><b>Pass mark</b><div class="seg"><button data-a="pass" data-v="85" aria-pressed="'+(settings.pass===85)+'">85% (PSPO I)</button><button data-a="pass" data-v="80" aria-pressed="'+(settings.pass===80)+'">80%</button></div><div class="muted small" style="margin-top:6px">Check the current official figure on the Scrum.org assessment page.</div></div>';
  h+='<div class="srow"><b>Sound</b><div class="seg"><button data-a="sound" data-v="1" aria-pressed="'+settings.sound+'">On</button><button data-a="sound" data-v="0" aria-pressed="'+!settings.sound+'">Muted</button></div></div>';
  h+='<div class="srow"><b>Look</b><div class="seg"><button data-a="theme" data-v="auto" aria-pressed="'+(settings.theme==='auto')+'">Auto</button><button data-a="theme" data-v="light" aria-pressed="'+(settings.theme==='light')+'">Light</button><button data-a="theme" data-v="dark" aria-pressed="'+(settings.theme==='dark')+'">Dark</button></div></div>';
  h+='<div class="srow"><button class="btn alt" data-a="reset">'+(resetArm?'Tap again to erase all progress':'Reset progress')+'</button></div>';
  h+='<div class="foot" style="margin-top:0">Original practice questions, not official Scrum.org questions. Confetti turns into a calm trophy screen if your device is set to reduce motion.</div></div></div>';
  return h;
}

function render(){
  const app=$('#app');
  let h=view==='quiz'&&round?(round.mode==='exam'?examView():round.cur?quizView():homeView()):view==='summary'&&summary?summaryView():homeView();
  if(showSettings)h+=settingsSheet();
  if(showOver&&round&&round.mode==='exam')h+=overviewSheet();
  if(cheat!=null)h+=cheatSheet();
  app.innerHTML=h;
  if(view==='summary'&&summary){
    const el=$('#ringp');
    if(el){
      const circ=2*Math.PI*54,off=circ*(1-calc().pct/100);
      if(reduce||!ringAnim){el.style.transition='none';el.style.strokeDashoffset=off}
      else{ringAnim=false;requestAnimationFrame(()=>requestAnimationFrame(()=>{el.style.strokeDashoffset=off}))}
    }
  }
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el)return;
  const a=el.dataset.a;
  const closeAll=()=>{showSettings=false;showOver=false;cheat=null;resetArm=false;render()};
  if(a==='scrim'){if(e.target===el)closeAll();return}
  const r=round;
  const top=()=>window.scrollTo(0,0);
  switch(a){
    case 'start':startRound('practice');break;
    case 'weak':{const w=weakestThemes(3);if(w)startRound('weak',w);break}
    case 'weakend':{
      const C=calc();
      const w=C.th.filter(t=>t.n>=3&&t.pct<C.PASS).sort((x,y)=>x.pct-y.pct).slice(0,3).map(t=>t.t);
      startRound('weak',w.length?w:weakestThemes(3));break}
    case 'exam':startRound('exam');break;
    case 'resume':
      if(!r)break;
      view='quiz';
      if(r.mode!=='exam'&&!r.cur)present();else{render();top()}
      if(r.mode==='exam')startTimer();
      break;
    case 'home':stopTimer();view='home';save();render();top();break;
    case 'pick':{
      if(!r)break;
      if(r.mode==='exam'){
        const q=Q[r.order[r.i]],real=ordFor(r,r.i)[+el.dataset.i],cur=r.ans[r.i]||[];
        r.ans[r.i]=q[1]==='m'?(cur.includes(real)?cur.filter(x=>x!==real):cur.concat(real)):[real];
        save();render();break;
      }
      const c=r.cur;if(!c||c.done)break;
      const q=Q[c.id],real=c.order[+el.dataset.i];
      if(q[1]==='m'){c.sel=c.sel.includes(real)?c.sel.filter(x=>x!==real):c.sel.concat(real);save();render()}
      else{c.sel=[real];record();render()}
      break}
    case 'check':if(r&&r.cur&&r.cur.sel.length&&!r.cur.done){record();render()}break;
    case 'cont':
      if(!r||!r.cur||!r.cur.done)break;
      if(r.cur.over)finish(true);else if(r.log.length>=r.total)finish();else present();
      break;
    case 'flag':if(r&&r.mode==='exam'){r.flag[r.i]=!r.flag[r.i];save();render()}break;
    case 'prev':if(r&&r.mode==='exam'&&r.i>0){r.i--;save();render();top()}break;
    case 'nextq':if(r&&r.mode==='exam'){if(r.i<79){r.i++;save();render();top()}else{showOver=true;render()}}break;
    case 'overview':if(r&&r.mode==='exam'){showOver=true;render()}break;
    case 'goto':if(r&&r.mode==='exam'){r.i=+el.dataset.i;showOver=false;save();render();top()}break;
    case 'submit':if(r&&r.mode==='exam'){showOver=false;submitExam()}break;
    case 'cheat':cheat=+el.dataset.t;render();break;
    case 'settings':showSettings=true;render();break;
    case 'close':closeAll();break;
    case 'pass':settings.pass=+el.dataset.v;save();render();break;
    case 'sound':settings.sound=el.dataset.v==='1';save();render();if(settings.sound)beep([[660,0,.1]]);break;
    case 'theme':settings.theme=el.dataset.v;applyTheme();save();render();break;
    case 'reset':
      if(!resetArm){resetArm=true;render()}
      else{prog=freshProg();round=null;summary=null;resetArm=false;showSettings=false;view='home';stopTimer();save();render()}
      break;
  }
});
document.addEventListener('input',e=>{
  if(e.target.id==='cnt'){
    settings.count=+e.target.value;
    $('#cntv').textContent=settings.count;
    $('#cntm').textContent='About '+Math.max(1,Math.round(settings.count*.3))+' min · 3 ❤️ per round';
    store.set(K.set,settings);
  }
});

render();
if(round&&round.mode==='exam'&&round.endsAt<=Date.now()){submitExam()}
})();
</script>
