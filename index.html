<style>
:root{
  --bg:#f3f1ff;--surface:#ffffff;--surface2:#ebe7ff;--ink:#1c1840;--muted:#625d86;--line:#dcd6f5;
  --brand:#5340d6;--brand-ink:#ffffff;--sun:#ffc83d;--sun-ink:#3a2a00;
  --good:#0f8a62;--good-bg:#dcf5ea;--warn:#b45f06;--warn-bg:#fff0d6;--shadow:0 8px 24px rgba(52,36,140,.12);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#13112b;--surface:#1d1a40;--surface2:#2b2760;--ink:#f1eeff;--muted:#aaa4d6;--line:#38336f;
    --brand:#9a8fff;--brand-ink:#13112b;--sun:#ffd24f;--sun-ink:#3a2a00;
    --good:#4fe0a8;--good-bg:#10382c;--warn:#ffb85c;--warn-bg:#3b2a10;--shadow:0 8px 24px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#13112b;--surface:#1d1a40;--surface2:#2b2760;--ink:#f1eeff;--muted:#aaa4d6;--line:#38336f;
  --brand:#9a8fff;--brand-ink:#13112b;--sun:#ffd24f;--sun-ink:#3a2a00;
  --good:#4fe0a8;--good-bg:#10382c;--warn:#ffb85c;--warn-bg:#3b2a10;--shadow:0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
h1,h2,h3{font-family:'Fredoka','Nunito',system-ui,sans-serif;margin:0;font-weight:600;line-height:1.15}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
#app{max-width:640px;margin:0 auto;padding:0 16px 40px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;background:var(--bg);display:flex;align-items:center;gap:12px;padding:12px 0}
.top h1{font-size:22px;flex:1;min-width:0}
.iconbtn{width:44px;height:44px;border-radius:14px;background:var(--surface);box-shadow:var(--shadow);font-size:20px;display:grid;place-items:center;flex:none}
.iconbtn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.card{background:var(--surface);border-radius:22px;padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
.card h2{font-size:19px;margin-bottom:10px}
.muted{color:var(--muted)}
.small{font-size:14px}
.btn{display:block;width:100%;min-height:54px;border-radius:18px;padding:12px 18px;font-weight:800;font-size:17px;background:var(--brand);color:var(--brand-ink);text-align:center;transition:transform .12s}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.alt{background:var(--surface2);color:var(--ink)}
.btn.sun{background:var(--sun);color:var(--sun-ink)}
.row{display:flex;gap:10px}
.row>*{flex:1}
.sliderbox{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px}
.sliderbox b{font-family:'Fredoka',sans-serif;font-size:34px;color:var(--brand-text,var(--brand))}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:44px;margin:0;background:transparent;cursor:pointer;border-radius:12px}
input[type=range]::-webkit-slider-runnable-track{height:10px;border-radius:99px;background:linear-gradient(var(--brand),var(--brand)) 0 0/calc(14px + (100% - 28px)*var(--f,0)) 100% no-repeat,var(--surface2)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:28px;height:28px;margin-top:-9px;border-radius:50%;background:#fff;border:3px solid var(--brand);box-shadow:0 2px 6px rgba(20,10,60,.25)}
input[type=range]::-moz-range-track{height:10px;border-radius:99px;background:var(--surface2)}
input[type=range]::-moz-range-progress{height:10px;border-radius:99px;background:var(--brand)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;border:3px solid var(--brand);box-shadow:0 2px 6px rgba(20,10,60,.25)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.stat{background:var(--surface);border-radius:18px;padding:10px 6px;text-align:center;box-shadow:var(--shadow)}
.stat b{display:block;font-family:'Fredoka',sans-serif;font-size:22px}
.stat span{font-size:12px;color:var(--muted)}
.trow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.trow:first-of-type{border-top:0}
.trow .em{font-size:22px;width:30px;text-align:center}
.trow .nm{flex:1;min-width:0;font-weight:700;font-size:15px;line-height:1.25}
.meter{display:block;height:8px;background:var(--surface2);border-radius:99px;overflow:hidden;margin-top:5px}
.meter i{display:block;height:100%;background:var(--accent,var(--good));border-radius:99px}
.heat{font-size:20px;width:28px;text-align:center}
.shelf{display:flex;flex-wrap:wrap;gap:4px;font-size:24px}
.resume{background:var(--sun);color:var(--sun-ink);display:flex;align-items:center;gap:12px}
.resume>div{flex:1;min-width:0}
.resume .btn{background:var(--sun-ink);color:var(--sun);width:auto;min-height:46px;flex:none}
.foot{font-size:13px;color:var(--muted);text-align:center;margin-top:20px;line-height:1.45}

/* quiz */
.bar{flex:1;height:12px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent,var(--good));border-radius:99px;transition:width .35s}
.meta{font-weight:800;min-width:64px;text-align:right;font-size:15px;white-space:nowrap}
.chip{display:inline-block;padding:4px 12px;border-radius:99px;background:var(--surface2);font-size:13px;font-weight:700;margin-bottom:12px}
.qtext{font-family:'Fredoka',sans-serif;font-size:21px;line-height:1.3;font-weight:500;margin:0 0 16px}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:flex-start;gap:12px;text-align:left;width:100%;min-height:56px;padding:13px 14px;border-radius:16px;border:2px solid var(--line);background:var(--surface);font-weight:600;line-height:1.35;transition:border-color .15s,background .15s}
.opt .mk{flex:none;width:26px;height:26px;border:2px solid var(--line);display:grid;place-items:center;font-size:15px;font-weight:800;margin-top:-1px;background:var(--bg)}
.opt .mk.r{border-radius:50%}.opt .mk.c{border-radius:8px}
.opt.sel{border-color:var(--brand-text,var(--brand));background:var(--surface2)}
.opt.sel .mk{border-color:var(--brand);background:var(--brand);color:var(--brand-ink)}
.opt.ok{border-color:var(--good);background:var(--good-bg)}
.opt.ok .mk{border-color:var(--good);background:var(--good);color:var(--bg)}
.opt.miss{border-color:var(--warn);background:var(--warn-bg)}
.opt.miss .mk{border-color:var(--warn);background:var(--warn);color:var(--bg)}
.opt.dim{opacity:.6}
.fb{margin-top:16px;border-radius:18px;padding:14px 16px;animation:rise .3s ease-out}
.fb.good{background:var(--good-bg)}.fb.warn{background:var(--warn-bg)}
.fb h3{font-size:18px;margin-bottom:4px}
.fb p{margin:4px 0 0}
.fb .ev{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-weight:700}
.act{margin-top:16px}

/* summary */
.sum{text-align:center;padding:8px 0}
.ringwrap{position:relative;width:200px;height:200px;margin:8px auto}
.ring{width:100%;height:100%}
.ring .trk{fill:none;stroke:var(--surface2);stroke-width:12}
.ring .prg{fill:none;stroke:var(--brand);stroke-width:12;stroke-linecap:round;transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1)}
.ring .pass{stroke:var(--sun);stroke-width:5;stroke-linecap:round}
.ringtxt{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ringtxt b{font-family:'Fredoka',sans-serif;font-size:46px;line-height:1}
.ringtxt span{color:var(--muted);font-weight:700}
.trophy{font-size:56px;animation:bounce .8s cubic-bezier(.3,1.6,.5,1) both}
.tag{display:inline-block;background:var(--surface2);border-radius:99px;padding:3px 12px;font-size:13px;font-weight:700;color:var(--muted)}
.parade{position:relative;height:48px;overflow:hidden;margin:6px 0 2px}
.parade div{position:absolute;white-space:nowrap;font-size:32px;animation:march 7s linear 1 both}
.brow{padding:8px 0}
.brow .hd{display:flex;justify-content:space-between;gap:8px;font-weight:700;font-size:15px}
.brow .hd span:last-child{white-space:nowrap}
.pbar{position:relative;height:12px;background:var(--surface2);border-radius:99px;margin-top:6px}
.pbar i{display:block;height:100%;border-radius:99px;background:var(--warn)}
.pbar i.p{background:var(--good)}
.pbar u{position:absolute;top:-3px;bottom:-3px;width:3px;background:var(--sun);border-radius:2px}
.focus{background:var(--warn-bg)}
.focus li{margin:8px 0}
ul.plain{margin:0;padding:0;list-style:none}
details{margin-top:8px}
summary{cursor:pointer;font-weight:800;padding:8px 0;min-height:44px;display:flex;align-items:center}
.miss-i{padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.miss-i b{display:block;margin-bottom:2px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,8,30,.55);z-index:70;display:flex;align-items:flex-end;justify-content:center}
.panel{background:var(--surface);width:100%;max-width:640px;border-radius:26px 26px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto;animation:rise .25s ease-out}
.seg{display:flex;gap:6px}
.seg button{flex:1;min-height:44px;border-radius:12px;background:var(--surface2);font-weight:800}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
.srow{margin:16px 0}
.srow>b{display:block;margin-bottom:8px}

.hearts{font-size:18px;letter-spacing:2px;white-space:nowrap;min-width:78px}
.ready{display:flex;gap:14px;align-items:center}
.ready .big{font-family:'Fredoka',sans-serif;font-size:46px;line-height:1;color:var(--brand-text,var(--brand))}
.ready .lab{font-weight:800}
.meter.big{height:12px}
.nav{display:flex;gap:10px;margin-top:16px}
.nav .btn{min-height:50px}
.flagbtn{min-height:44px;padding:8px 14px;border-radius:14px;background:var(--surface2);font-weight:800}
.flagbtn[aria-pressed="true"]{background:var(--sun);color:var(--sun-ink)}
.grid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin:12px 0}
.gq{aspect-ratio:1;border-radius:10px;border:2px solid var(--line);font-weight:800;font-size:14px;position:relative;background:var(--surface);min-width:0}
.gq.a{background:var(--surface2);border-color:var(--brand-text,var(--brand))}
.gq.cur{outline:3px solid var(--sun)}
.gq.f::after{content:"🚩";position:absolute;top:-7px;right:-5px;font-size:12px}
.cheat li{margin:6px 0}
.qtext b{color:var(--brand-text,var(--brand));text-decoration:underline;text-underline-offset:3px}
/* home, progress, pages */
.seg button[disabled]{opacity:.55;cursor:default}
.swatches{display:flex;gap:12px;flex-wrap:wrap;margin-top:4px}
.sw-btn{width:44px;height:44px;border-radius:50%;background:var(--c);border:0;box-shadow:inset 0 0 0 3px rgba(255,255,255,.35)}
.sw-btn[aria-pressed="true"]{outline:3px solid var(--ink);outline-offset:3px}
.seg small{font-weight:700;opacity:.85;margin-left:2px}
.lv{margin-bottom:14px}
.lv button{min-height:46px;border-radius:14px;background:var(--surface);box-shadow:var(--shadow)}
.chev{color:var(--muted);font-size:22px;line-height:1;flex:none}
.rd{display:block;width:100%;text-align:left}
.rdh{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.rdh h2{flex:1;margin:0}
.rdh b{font-family:'Fredoka',sans-serif;font-size:24px;line-height:1;color:var(--brand-text,var(--brand))}
.rd .small{display:block;margin-top:8px}
button.trow{width:100%;text-align:left}
.tl{display:flex;align-items:center;gap:8px;margin-top:5px}
.tl .meter{flex:1;margin:0}
.tl small{font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap;min-width:84px;text-align:right}
.tl small.w{color:var(--warn)}.tl small.g{color:var(--good)}
.qmeta{display:flex;justify-content:space-between;gap:10px;margin:0 2px 10px}
.hearts .pop{display:inline-block;animation:heart .7s cubic-bezier(.3,1.6,.5,1)}
.passlab{position:absolute;transform:translate(-50%,-50%);font-size:12px;font-weight:800;color:var(--muted);white-space:nowrap}
.steps{margin:0;padding-left:22px}
.credit{text-align:center;font-size:14px;color:var(--muted);margin-top:22px;line-height:1.8;border-top:1px solid var(--line);padding-top:14px}
.credit a{color:var(--brand-text,var(--brand));font-weight:800;text-decoration:underline;text-underline-offset:3px}
.credit a.rel{color:var(--ink);font-size:13px;margin-top:4px;display:inline-block}
.steps li{margin:6px 0}
.card h2 .tag{vertical-align:middle;margin-left:6px}
.more{margin-top:10px;border-top:1px dashed var(--line)}
.more summary{font-size:15px}
.more summary::after{content:"+";margin-left:8px;color:var(--muted);font-weight:800}
.more[open] summary::after{content:"–"}
.more p{margin:0 0 10px;font-size:15px}
.more blockquote{margin:0 0 10px;padding:8px 12px;border-left:3px solid var(--brand-text,var(--brand));background:var(--surface);border-radius:0 10px 10px 0;font-size:15px}
.more cite{display:block;margin-top:4px;font-size:12px;font-style:normal;color:var(--muted)}
/* launch */
#splash{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;pointer-events:none;animation:splashout .25s ease-in .9s forwards}
#splash svg{width:96px;overflow:visible}
#splash svg *{transform-box:fill-box;transform-origin:center}
.sr{fill:none;stroke:var(--accent,var(--good));stroke-width:11;animation:sring .9s ease-out both}
.sd{fill:var(--sun);animation:sdrop .9s cubic-bezier(.5,0,.8,.6) both}
@keyframes sdrop{0%{transform:translateY(-330%);opacity:0}10%{opacity:1}52%{transform:translateY(0)}66%{transform:translateY(-28%)}80%,100%{transform:translateY(0)}}
@keyframes sring{0%,50%{transform:scale(1)}62%{transform:scale(1.09)}78%,100%{transform:scale(1)}}
@keyframes splashout{to{opacity:0;visibility:hidden}}
@keyframes heart{0%{transform:scale(.3)}60%{transform:scale(1.5)}100%{transform:scale(1)}}
@media (max-width:480px){
  #app{padding:0 14px 32px}
  .card{padding:16px;border-radius:20px}
  .top h1{font-size:20px}
  .qtext{font-size:19px}
  .ringwrap{width:176px;height:176px}
  .ringtxt b{font-size:40px}
  .stats{grid-template-columns:repeat(2,1fr)}
}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes wob{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
@keyframes bounce{0%{transform:scale(0) rotate(-20deg)}100%{transform:scale(1) rotate(0)}}
@keyframes march{from{left:-100%}to{left:100%}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .parade div{position:static}
  #splash{display:none}
}
</style>
</head>
