  if(enough.length){
    h+='<div class="card"><h2>Score by theme</h2>';
    enough.forEach(t=>{
      h+='<div class="brow"><div class="hd"><span>'+THEMES[t.t].e+' '+esc(THEMES[t.t].n)+'</span><span>'+t.pct+'% <span class="muted">('+t.c+'/'+t.n+')</span></span></div><div class="pbar"><i class="'+(t.pct>=PASS?'p':'')+'" style="width:'+t.pct+'%"></i><u style="left:calc('+PASS+'% - 1px)"></u></div></div>';
    });
    h+='</div>';
  }

  const missed=S.log.filter(l=>!l.ok);
  if(missed.length){
    h+='<div class="card"><details><summary>Review missed questions ('+missed.length+')</summary>'+missed.map(l=>{
      const q=Q[l.id];
      return '<div class="miss-i"><b>'+esc(q[2])+'</b><div>Answer: '+esc(q[4].map(i=>optsOf(q)[i]).join(' / '))+'</div><div class="muted">'+esc(q[5])+'</div></div>';
    }).join('')+'</details></div>';
  }
  return h;
}

function settingsSheet(){
  let h='<div class="scrim" data-a="scrim"><div class="panel" role="dialog" aria-label="Settings"><div class="row" style="align-items:center"><h2>Settings</h2><button class="iconbtn" data-a="close" aria-label="Close" style="flex:none;margin-left:auto">'+IC.close+'</button></div>';
  h+='<div class="srow"><b>Pass mark</b><div class="seg"><button data-a="pass" data-v="85" aria-pressed="'+(settings.pass===85)+'">85%</button><button data-a="pass" data-v="80" aria-pressed="'+(settings.pass===80)+'">80%</button></div></div>';
  h+='<div class="srow"><b>Sound</b><div class="seg"><button data-a="sound" data-v="1" aria-pressed="'+settings.sound+'">On</button><button data-a="sound" data-v="0" aria-pressed="'+!settings.sound+'">Muted</button></div></div>';
  h+='<div class="srow"><b>Look</b><div class="seg"><button data-a="theme" data-v="auto" aria-pressed="'+(settings.theme==='auto')+'">Auto</button><button data-a="theme" data-v="light" aria-pressed="'+(settings.theme==='light')+'">Light</button><button data-a="theme" data-v="dark" aria-pressed="'+(settings.theme==='dark')+'">Dark</button></div></div>';
  h+='<div class="srow"><b>Colour</b><div class="swatches" role="group" aria-label="Colour">'+Object.keys(PSPO_ACCENTS).map(k=>'<button class="sw-btn" data-a="accent" data-v="'+k+'" aria-pressed="'+(settings.accent===k)+'" aria-label="'+PSPO_ACCENTS[k].n+'" title="'+PSPO_ACCENTS[k].n+'" style="--c:'+PSPO_ACCENTS[k].l+'"></button>').join('')+'</div><div class="muted small" style="margin-top:6px">'+PSPO_ACCENTS[settings.accent].n+'</div></div>';
  h+='<div class="srow"><button class="btn alt" data-a="how">How it works</button>'+'<button class="btn alt" data-a="install" style="margin-top:10px">Add to your phone or computer</button>'+'<button class="btn alt" data-a="reset" style="margin-top:10px">'+(resetArm?'Tap again to erase your '+LEVELS[settings.level].name+' progress':'Reset '+LEVELS[settings.level].name+' progress')+'</button></div>';
  h+='<div class="credit">Made by <a href="https://www.linkedin.com/in/miguelrijk" target="_blank" rel="noopener">Miguel Rijk</a><br><a class="rel" href="https://github.com/Dufiboy/pspo-training/releases" target="_blank" rel="noopener">See latest release →</a></div>';
  h+='</div></div>';
  return h;
}

function howView(){
  const li=a=>'<ul class="steps">'+a.map(x=>'<li>'+x+'</li>').join('')+'</ul>';
  let h=header('How it works',backBtn);
  h+='<div class="card"><h2>Rounds</h2>'+li(['A wrong answer costs a ❤️. Lose all three and the round ends.','5 correct in a row wins a ❤️ back.','A question you miss comes back until you get it right twice in a row. Then it is mastered ⭐ and joins your trophy shelf.','Every idea is asked in more than one wording, to check that you understand it.'])+'</div>';
  h+='<div class="card"><h2>Weak themes</h2>'+li(['A round on the three themes you score lowest on.'])+'</div>';
  h+='<div class="card"><h2>Exam mode</h2>'+li([EX.n+' questions in '+EX.min+' minutes, like the real '+LEVELS[settings.level].name+' exam.','No lives, and no feedback until you submit.','The pass mark is '+settings.pass+'%.'])+'</div>';
  h+='<div class="card"><h2>Progress</h2>'+li(['Exam readiness combines your recent accuracy across all '+THEMES.length+' themes. It shows after 15 answers.','The daily goal is '+GOAL+' questions.','Progress is saved on this device only.'])+'</div>';
  h+='<div class="foot">Original practice questions, not official Scrum.org assessment questions. Themes follow The Professional Product Owner and the Scrum Guide. Scrum Guide quotes © 2020 Ken Schwaber and Jeff Sutherland, used under the CC BY-SA 4.0 licence.</div>';
  return h;
}

function installView(){
  const ua=navigator.userAgent;
  const dev=/iPhone|iPad|iPod/.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1)?'ios':/Android/.test(ua)?'android':'desktop';
  const S={
    ios:['iPhone or iPad',['Open this page in Safari.','Tap the Share button (the square with an arrow).','Choose “Add to Home Screen”, then tap Add.']],
    android:['Android',['Open this page in Chrome.','Tap the ⋮ menu.','Choose “Add to Home screen” or “Install app”.']],
    desktop:['Computer',['Chrome or Edge: click the install icon at the right of the address bar.','Safari on a Mac: choose File, then Add to Dock.']]
  };
  let h=header('Add to your device',backBtn);
  if(installed())h+='<div class="card"><b>Already installed on this device ✓</b></div>';
  else if(deferred)h+='<button class="btn" data-a="installnow" style="margin-bottom:14px">Install now</button>';
  [dev].concat(['ios','android','desktop'].filter(k=>k!==dev)).forEach((k,i)=>{
    h+='<div class="card"><h2>'+S[k][0]+(i===0?' <span class="tag">this device</span>':'')+'</h2><ol class="steps">'+S[k][1].map(x=>'<li>'+x+'</li>').join('')+'</ol></div>';
  });
  h+='<div class="foot">Once added, it opens like any other app and works offline.</div>';
  return h;
}

function render(){
  const app=$('#app');
  let h=view==='quiz'&&round?(round.mode==='exam'?examView():round.cur?quizView():homeView()):view==='summary'&&summary?summaryView():view==='progress'?progressView():view==='how'?howView():view==='install'?installView():homeView();
  if(showSettings)h+=settingsSheet();
  if(showOver&&round&&round.mode==='exam')h+=overviewSheet();
  if(cheat!=null)h+=cheatSheet();
  app.innerHTML=h;
  if(view==='summary'&&summary){
    const el=$('#ringp');
    if(el){
      const circ=2*Math.PI*54,off=circ*(1-calc().pct/100);
      if(reduce||!ringAnim){el.style.transition='none';el.style.strokeDashoffset=off}
      else{ringAnim=false;requestAnimationFrame(()=>requestAnimationFrame(()=>{el.style.strokeDashoffset=off}))}
    }
  }
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el)return;
  const a=el.dataset.a;
  const closeAll=()=>{showSettings=false;showOver=false;cheat=null;resetArm=false;render()};
  if(a==='scrim'){if(e.target===el)closeAll();return}
  const r=round;
  const top=()=>window.scrollTo(0,0);
  switch(a){
    case 'start':startRound('practice');break;
    case 'weak':{const w=weakestThemes(3);if(w)startRound('weak',w);break}
    case 'weakend':{
      const C=calc();
      const w=C.th.filter(t=>t.n>=3&&t.pct<C.PASS).sort((x,y)=>x.pct-y.pct).slice(0,3).map(t=>t.t);
      startRound('weak',w.length?w:weakestThemes(3));break}
    case 'exam':startRound('exam');break;
    case 'resume':
      if(!r)break;
      view='quiz';
      if(r.mode!=='exam'&&!r.cur)present();else{render();top()}
      if(r.mode==='exam')startTimer();
      break;
    case 'home':stopTimer();view='home';save();render();top();break;
    case 'pick':{
      if(!r)break;
      if(r.mode==='exam'){
        const q=Q[r.order[r.i]],real=ordFor(r,r.i)[+el.dataset.i],cur=r.ans[r.i]||[];
        r.ans[r.i]=q[1]==='m'?(cur.includes(real)?cur.filter(x=>x!==real):cur.concat(real)):[real];
        save();render();break;
      }
      const c=r.cur;if(!c||c.done)break;
      const q=Q[c.id],real=c.order[+el.dataset.i];
      if(q[1]==='m'){c.sel=c.sel.includes(real)?c.sel.filter(x=>x!==real):c.sel.concat(real);save();render()}
      else{c.sel=[real];record();render()}
      break}
    case 'check':if(r&&r.cur&&r.cur.sel.length&&!r.cur.done){record();render()}break;
    case 'cont':
      if(!r||!r.cur||!r.cur.done)break;
      if(r.cur.over)finish(true);else if(r.log.length>=r.total)finish();else present();
      break;
    case 'flag':if(r&&r.mode==='exam'){r.flag[r.i]=!r.flag[r.i];save();render()}break;
    case 'prev':if(r&&r.mode==='exam'&&r.i>0){r.i--;save();render();top()}break;
    case 'nextq':if(r&&r.mode==='exam'){if(r.i<r.order.length-1){r.i++;save();render();top()}else{showOver=true;render()}}break;
    case 'overview':if(r&&r.mode==='exam'){showOver=true;render()}break;
    case 'goto':if(r&&r.mode==='exam'){r.i=+el.dataset.i;showOver=false;save();render();top()}break;
    case 'submit':if(r&&r.mode==='exam'){showOver=false;submitExam()}break;
    case 'cheat':cheat=+el.dataset.t;render();break;
    case 'level':{
      const v=+el.dataset.v;
      if(v!==settings.level&&LEVELS[v]){stopTimer();save();settings.level=v;summary=null;loadLevel();save();render()}
      break}
    case 'settings':showSettings=true;render();break;
    case 'progress':case 'how':case 'install':showSettings=false;resetArm=false;view=a;render();top();break;
    case 'installnow':if(deferred){const d=deferred;deferred=null;d.prompt();render()}break;
    case 'close':closeAll();break;
    case 'pass':settings.pass=+el.dataset.v;save();render();break;
    case 'sound':settings.sound=el.dataset.v==='1';save();render();if(settings.sound)beep([[660,0,.1]]);break;
    case 'theme':settings.theme=el.dataset.v;applyTheme();save();render();break;
    case 'accent':settings.accent=el.dataset.v;save();pspoAccent();render();break;
    case 'reset':
      if(!resetArm){resetArm=true;render()}
      else{prog=freshProg();round=null;summary=null;resetArm=false;showSettings=false;view='home';stopTimer();save();render()}
      break;
  }
});
document.addEventListener('input',e=>{
  if(e.target.id==='cnt'){
    settings.count=+e.target.value;
    e.target.style.setProperty('--f',(settings.count-5)/35);
    $('#cntv').textContent=settings.count;
    $('#cntm').textContent='About '+Math.max(1,Math.round(settings.count*.3))+' min';
    store.set(K.set,settings);
  }
});

window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;if(view==='install')render()});
window.addEventListener('appinstalled',()=>{deferred=null;if(view==='install')render()});
render();
setTimeout(()=>{const sp=$('#splash');if(sp)sp.remove()},1400);
if(round&&round.mode==='exam'&&round.endsAt<=Date.now()){submitExam()}
})();
</script>
