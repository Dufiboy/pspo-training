const NOTES1=[
 ['Accountability means one person answers for the result. The whole Scrum Team creates value, but the Product Owner answers for whether the product is worth the investment, through choices about what to build next and what to leave out.','The Product Owner is accountable for maximizing the value of the product resulting from the work of the Scrum Team.','Product Owner','Accountable does not mean doing all the work alone. It means owning the outcome.'],
 ['One decision maker keeps ordering fast and consistent. A committee tends to produce compromises and delays, and nobody clearly answers for the result.','The Product Owner is one person, not a committee.','Product Owner','Stakeholders and committees can advise and try to convince the Product Owner. They do not vote.'],
 ['Product Backlog management has four parts: developing and communicating the Product Goal, creating and communicating items, ordering them, and keeping the backlog transparent, visible and understood.','The Product Owner is also accountable for effective Product Backlog management','Product Owner','Assigning tasks, running the Daily Scrum and deciding how work is done are not Product Owner accountabilities. Those belong to the Developers.'],
 ['Developers often write and refine items, and that is healthy. What cannot be handed over is answering for the result: the order, the clarity and the value.','The Product Owner may do the above work or may delegate the responsibility to others. Regardless, the Product Owner remains accountable.','Product Owner','Delegating the work never moves the accountability to someone else.'],
 ['Scrum.org describes six preferred stances: Visionary, Collaborator, Customer Representative, Decision Maker, Experimenter and Influencer. The Experimenter treats ideas as hypotheses and tests them with small experiments before investing heavily.','','','Stances are not in the Scrum Guide. They describe attitudes a Product Owner switches between, not job titles.','Scrum.org: the Product Owner stances'],
 ['Seniority does not order the Product Backlog. The Product Owner listens, weighs the value and decides, and makes the reasoning visible so that people can challenge it with evidence.','For Product Owners to succeed, the entire organization must respect their decisions.','Product Owner','Respecting the decision does not mean the Product Owner stops listening. Anyone can try to convince them.'],
 ['Cancelling is rare and costly, since a Sprint is short anyway. It makes sense only when the Sprint Goal no longer has a point, for example after a change of direction.','A Sprint could be cancelled if the Sprint Goal becomes obsolete. Only the Product Owner has the authority to cancel the Sprint.','The Sprint','Others can recommend cancelling. Unfinished work or a difficult Sprint are not reasons to cancel.'],
 ['A product vision says why the product exists, for whom, and what future it aims for. It gives people a reason to care and a test for decisions: does this bring us closer?','','','A vision is not a feature list or a schedule. If it names dates and scope, it is a plan.','The Professional Product Owner: chapter on vision'],
 ['Strategy connects the vision to daily choices: which customers to serve, which problem to solve for them, and why they would choose this product over the alternatives.','','','A plan of tasks is not a strategy. Strategy is about choices and trade-offs, including what not to do.','The Professional Product Owner: chapter on vision'],
 ['A vision only aligns people who know it. Shared widely, it lets Developers and stakeholders make good decisions without asking the Product Owner each time.','','','Keeping the vision to yourself makes you a bottleneck.','The Professional Product Owner: chapter on vision'],
 ['People forget a vision that is presented once. Keep it short, keep it visible, and refer to it when ordering the backlog and in Sprint Reviews.','','','A long document nobody reads does not count as a shared vision.','The Professional Product Owner: chapter on vision'],
 ['Vision and strategy are assumptions about the market. When evidence shows the market has moved, update them, then let the Product Goal and the Product Backlog follow.','A Scrum Team is expected to adapt the moment it learns anything new through inspection.','Adaptation','Waiting for the release, or for someone else to decide, wastes the investment made in the meantime.'],
 ['A quick test of strategy: can the team say who the product is for, what need it serves, and why customers would pick it? Internal measures such as velocity say nothing about that.','','','Being busy and having a clear strategy are different things.','The Professional Product Owner: chapter on vision'],
 ['A vision should be stable enough to give direction for a long time, and open to change when the evidence demands it.','','','Stable is not the same as fixed.','The Professional Product Owner: chapter on vision'],
 ['Each artifact carries a commitment that gives it focus: the Product Goal for the Product Backlog, the Sprint Goal for the Sprint Backlog, and the Definition of Done for the Increment.','The Product Goal is in the Product Backlog. The rest of the Product Backlog emerges to define “what” will fulfill the Product Goal.','Commitment: Product Goal','A roadmap is not a Scrum artifact, and the Product Goal does not live there.'],
 ['One goal at a time gives focus. Several goals in parallel split attention and make it unclear what the backlog is ordered toward.','The Product Goal is the long-term objective for the Scrum Team. They must fulfill (or abandon) one objective before taking on the next.','Commitment: Product Goal','One Product Goal does not mean one Sprint Goal. Many Sprints usually serve the same Product Goal.'],
 ['The Product Goal sits between the vision and the Sprint. It is concrete enough to plan toward and to measure progress against.','The Product Goal describes a future state of the product which can serve as a target for the Scrum Team to plan against.','Commitment: Product Goal','It describes a future state, not a list of features.'],
 ['A useful roadmap shows the direction and the outcomes you intend to reach, in rough order, and is updated as you learn. It supports conversations with stakeholders.','','','Roadmaps are not part of Scrum. Used as a fixed contract of features and dates, they remove the ability to adapt.','The Professional Product Owner: chapter on release management'],
 ['The Product Goal belongs to the whole Scrum Team. The Product Owner is accountable for developing and communicating it, and Sprints are steps toward it.','It is a cohesive unit of professionals focused on one objective at a time, the Product Goal.','Scrum Team','It is not owned by the Developers alone, and it is not reached in a single Sprint.'],
 ['Abandoning a goal is a legitimate outcome when evidence shows it no longer leads to value. Being open about it early saves money and trust.','They must fulfill (or abandon) one objective before taking on the next.','Commitment: Product Goal','Pushing harder toward a goal nobody wants is the expensive choice.'],
 ['Dates and features a year ahead look like certainty. People plan around them, and the team is then held to guesses made when it knew the least.','In complex environments, what will happen is unknown. Only what has already happened may be used for forward-looking decision making.','The Sprint','The answer is not to refuse planning. Forecast, show the uncertainty, and update often.'],
 ['Emergent means it is never finished. Ordered means there is a clear top. Single source means all work for the product is visible in one place.','The Product Backlog is an emergent, ordered list of what is needed to improve the product. It is the single source of work undertaken by the Scrum Team.','Product Backlog','It is not a signed-off specification, and not a list of Sprint tasks.'],
 ['Others may write and refine items, but one person answers for the state of the Product Backlog: its order, its clarity and whether people understand it.','Ensuring that the Product Backlog is transparent, visible and understood.','Product Owner','There is no project manager in Scrum to take this over.'],
 ['As long as the product exists, new ideas, feedback and market changes keep arriving. Items are added, changed and removed at any time, including during a Sprint.','The Product Backlog is an emergent, ordered list of what is needed to improve the product.','Product Backlog','What is protected during a Sprint is the Sprint Goal, not the Product Backlog.'],
 ['Refinement happens whenever it is useful, usually with the Product Owner and the Developers together. Its result is items clear and small enough to finish within a Sprint.','Product Backlog refinement is the act of breaking down and further defining Product Backlog items into smaller more precise items. This is an ongoing activity to add details, such as a description, order, and size.','Product Backlog','Refinement is not one of the five Scrum events, and it has no timebox.'],
 ['The Scrum Guide says the Product Owner orders the backlog, but not how. Common factors are value, risk, dependencies, urgency and what the team needs to learn first.','','','Who pushes hardest, who is most senior and which item is oldest are not ordering factors.','Scrum Guide: Product Owner'],
 ['Detail is added just in time. Items near the top are small and clear because they are next. Items further down stay rough, since they may change or never be built.','Product Backlog items that can be Done by the Scrum Team within one Sprint are deemed ready for selection in a Sprint Planning event.','Product Backlog','Refining everything to the same level is waste.'],
 ['A very long backlog hides what matters, and gives false hope to people whose requests sit at the bottom. Removing items that will not create value is part of keeping it transparent.','','','Deleting an item is allowed. If it matters, it will come back.','Scrum Guide: Product Backlog'],
 ['Evidence-Based Management groups measures into four Key Value Areas. Current Value and Unrealized Value describe value in the market. Time-to-Market and Ability to Innovate describe the organization’s capability to deliver it.','','','Velocity, scope, cost and schedule are not Key Value Areas.','Scrum.org: Evidence-Based Management Guide'],
 ['Current Value shows what the product delivers to customers and the organization today. Typical measures are customer satisfaction, usage and revenue per employee.','','','It looks at the present, not at potential.','Scrum.org: Evidence-Based Management Guide'],
 ['Unrealized Value is the gap between what customers experience today and what they would ideally like. A large gap means there is room worth investing in.','','','It is not unfinished work or unused capacity.','Scrum.org: Evidence-Based Management Guide'],
 ['Time-to-Market is how quickly the organization can deliver a new capability, service or product. Typical measures are release frequency and lead time.','','','Fast delivery only helps if what is delivered is valuable.','Scrum.org: Evidence-Based Management Guide'],
 ['Ability to Innovate is how effectively the organization can deliver new capabilities that better meet customer needs. Technical debt, defects and time spent on maintenance all reduce it.','','','A team can look busy while almost all of its effort goes into keeping old work running.','Scrum.org: Evidence-Based Management Guide'],
 ['Velocity counts how much work a team completed. It says nothing about whether customers are better off. Value shows up in outcomes such as satisfaction, usage and retention.','','','Rewarding higher velocity invites inflated estimates, not more value.','Scrum.org: Evidence-Based Management Guide'],
 ['Output is what the team produces. Outcome is the change for the customer. Measure outcomes to learn whether the output was worth building.','','','Story points, features shipped and lines of code are all output.','Scrum.org: Evidence-Based Management Guide'],
 ['A stakeholder is anyone outside the Scrum Team with an interest in the product or knowledge about it: users, customers, executives, legal, sales, support.','The Scrum Team and its stakeholders inspect the results and adjust for the next Sprint.','Scrum Definition','Stakeholders are not part of the Scrum Team, and they do not attend the Sprint Retrospective.'],
 ['The Product Owner learns what is valuable by talking to users and stakeholders all the time. The Sprint Review is one formal moment for it, not the only one.','The Scrum Team is responsible for all product-related activities from stakeholder collaboration, verification, maintenance, operation, experimentation, research and development, and anything else that might be required.','Scrum Team','Protecting the team’s focus does not mean cutting off contact with the people the product is for.'],
 ['Conflicting wishes are normal. The Product Owner brings the reasoning into the open, weighs it against the goal, decides the order and explains why.','The Product Owner may represent the needs of many stakeholders in the Product Backlog.','Product Owner','Splitting evenly or letting rank decide avoids the decision. It does not maximize value.'],
 ['Good involvement means stakeholders see real results often, understand the backlog and know that their input is heard.','During the event, the Scrum Team and stakeholders review what was accomplished in the Sprint and what has changed in their environment.','Sprint Review','They influence the Product Owner. They do not assign work to Developers or sign off Sprints.'],
 ['Developers talking to customers is valuable. The request still goes to the Product Owner, who decides whether and where it enters the Product Backlog.','Those wanting to change the Product Backlog can do so by trying to convince the Product Owner.','Product Owner','Slipping work into the Sprint bypasses the ordering and can endanger the Sprint Goal.'],
 ['In the Customer Representative stance the Product Owner brings the customer’s problems and context into the team, so that people understand who they build for and why.','','','Representing customers is not the same as passing on every request unfiltered.','Scrum.org: the Product Owner stances'],
 ['A forecast based on what the team has actually delivered, shared with its uncertainty and updated every Sprint, gives stakeholders something they can rely on.','Various practices exist to forecast progress, like burn-downs, burn-ups, or cumulative flows. While proven useful, these do not replace the importance of empiricism.','The Sprint','Scrum does not forbid forecasts. It warns against treating them as guarantees.'],
 ['Until customers use something, its value is an assumption. Releasing small, usable Increments often turns assumptions into evidence and limits the cost of being wrong.','Shorter Sprints can be employed to generate more learning cycles and limit risk of cost and effort to a smaller time frame.','The Sprint','Releasing often is not a way to skip testing. Every Increment meets the Definition of Done.'],
 ['State an idea as a hypothesis: we believe this change will lead to that result for these customers. Then decide how you will know.','Empiricism asserts that knowledge comes from experience and making decisions based on what is observed.','Scrum Theory','Confidence is not evidence, however senior the person.'],
 ['A minimum viable product is the smallest thing that lets you test whether an idea is worth pursuing. Its purpose is learning, with as little effort as possible.','','','Minimum does not mean low quality, and an MVP is not a first release of everything.','The Professional Product Owner: chapter on validation'],
 ['A good experiment has a clear hypothesis, a measure of success agreed in advance, and a small scope so that the answer comes quickly.','','','If no result could change your mind, it is not an experiment.','The Professional Product Owner: chapter on validation'],
 ['Learning that a feature is not used is a result, not a failure. Find out why, then adapt: improve it, try another approach or remove it.','If any aspects of a process deviate outside acceptable limits or if the resulting product is unacceptable, the process being applied or the materials being produced must be adjusted.','Adaptation','Unused features still cost money to maintain.'],
 ['Opinions, documents and approvals predict value. Only real use shows it. The shorter the path from idea to real users, the faster you learn.','In order to provide value, the Increment must be usable.','Increment','Internal demos give feedback on the solution, not on whether customers want it.'],
 ['A product can gain many features and lose value, when they add complexity without solving a problem. Judge by the result for customers, not by the amount delivered.','','','More output can mean less outcome.','The Professional Product Owner: chapter on value'],
 ['Sprint Planning has three topics: why this Sprint is valuable, what can be Done, and how the chosen work will get done. The why comes first and results in the Sprint Goal.','The whole Scrum Team then collaborates to define a Sprint Goal that communicates why the Sprint is valuable to stakeholders.','Sprint Planning','The Product Owner proposes the value. The Developers decide what they can take on, and how.'],
 ['The Product Owner proposes how the product could become more valuable this Sprint, and the whole Scrum Team shapes that into a Sprint Goal before Sprint Planning ends.','This resulting plan is created by the collaborative work of the entire Scrum Team.','Sprint Planning','The Sprint Goal is not handed down by the Product Owner or by stakeholders.'],
 ['Timeboxes are maximums. For a one-month Sprint: Sprint Planning 8 hours, Sprint Review 4, Sprint Retrospective 3. The Daily Scrum is always 15 minutes.','Sprint Planning is timeboxed to a maximum of eight hours for a one-month Sprint. For shorter Sprints, the event is usually shorter.','Sprint Planning','The guide gives no formula for shorter Sprints. It only says usually shorter.'],
 ['The Sprint Goal stays fixed for the Sprint, which is what gives the Developers focus. The work needed to reach it can change as they learn.','No changes are made that would endanger the Sprint Goal','The Sprint','Scope can be renegotiated with the Product Owner. The goal cannot be swapped in mid-Sprint.'],
 ['Only the people doing the work can judge how much they can finish to the Definition of Done. The Product Owner influences this by explaining value and trade-offs.','Through discussion with the Product Owner, the Developers select items from the Product Backlog to include in the current Sprint.','Sprint Planning','Pushing more into the Sprint does not produce more. It produces unfinished work.'],
 ['A single objective lets the team work together instead of on separate items, and leaves room to adjust the work.','The Sprint Goal is the single objective for the Sprint. Although the Sprint Goal is a commitment by the Developers, it provides flexibility in terms of the exact work needed to achieve it.','Commitment: Sprint Goal','It is not a list of every item in the Sprint.'],
 ['A short, fixed length limits risk: at least once a month the team and its stakeholders inspect a real result and can change direction.','They are fixed length events of one month or less to create consistency. A new Sprint starts immediately after the conclusion of the previous Sprint.','The Sprint','A Sprint is never extended to finish work, and there are no gaps between Sprints.'],
 ['The Sprint Review looks at what was achieved and what changed in the market, and the people present work out together what to do next. The Product Backlog may be adjusted.','The purpose of the Sprint Review is to inspect the outcome of the Sprint and determine future adaptations.','Sprint Review','It is not an approval gate, a status report or an evaluation of people.'],
 ['The value of the Review is in the conversation: feedback from stakeholders, new information from the market, and ideas for what comes next.','The Sprint Review is a working session and the Scrum Team should avoid limiting it to a presentation.','Sprint Review','A polished demo with no discussion wastes the one event where stakeholders are in the room.'],
 ['The Scrum Team inspects how the Sprint went: individuals, interactions, processes, tools and the Definition of Done. It then picks the most helpful improvements.','The purpose of the Sprint Retrospective is to plan ways to increase quality and effectiveness.','Sprint Retrospective','It looks at how the team works, not at the product. The product is inspected in the Sprint Review.'],
 ['The Retrospective is the last event of the Sprint. The next Sprint starts right after it, with Sprint Planning.','The Sprint Retrospective concludes the Sprint. It is timeboxed to a maximum of three hours for a one-month Sprint.','Sprint Retrospective','Do not mix up the maximums: Review 4 hours, Retrospective 3 hours.'],
 ['The Retrospective is for the Scrum Team: the Product Owner, the Scrum Master and the Developers. The Product Owner takes part as a member of the team.','The Scrum Team identifies the most helpful changes to improve its effectiveness.','Sprint Retrospective','Stakeholders and managers do not attend. Their presence makes openness harder.'],
 ['Four hours is the upper limit for a one-month Sprint. Shorter Sprints usually have shorter Reviews.','The Sprint Review is the second to last event of the Sprint and is timeboxed to a maximum of four hours for a one-month Sprint.','Sprint Review','Second to last means the Retrospective still follows.'],
 ['An Increment is real, usable product, not a document or a promise. Each one builds on the previous ones.','An Increment is a concrete stepping stone toward the Product Goal. Each Increment is additive to all prior Increments and thoroughly verified, ensuring that all Increments work together.','Increment','Work in progress and nearly finished items are not an Increment.'],
 ['The team can release whenever an item meets the Definition of Done. The Sprint Review inspects the sum of what was done, whether or not it is already live.','However, an Increment may be delivered to stakeholders prior to the end of the Sprint. The Sprint Review should never be considered a gate to releasing value.','Increment','Waiting for the Review before releasing delays value and feedback.'],
 ['The Definition of Done applies to every item. It gives everyone the same understanding of what done means, which is what makes progress transparent.','The Definition of Done is a formal description of the state of the Increment when it meets the quality measures required for the product.','Commitment: Definition of Done','It is not the acceptance criteria of a single item, which differ from item to item.'],
 ['If the organization has a standard, every Scrum Team follows it as a minimum and may add stricter criteria. If not, the Scrum Team creates its own.','If it is not an organizational standard, the Scrum Team must create a Definition of Done appropriate for the product.','Commitment: Definition of Done','The whole Scrum Team creates it, not the Product Owner or the Scrum Master alone.'],
 ['There is no partial credit. An unfinished item goes back to the Product Backlog, where the Product Owner decides whether and when it is picked up again.','If a Product Backlog item does not meet the Definition of Done, it cannot be released or even presented at the Sprint Review. Instead, it returns to the Product Backlog for future consideration.','Commitment: Definition of Done','It does not roll over automatically into the next Sprint.'],
 ['Several teams on one product deliver one integrated Increment. That only works when done means the same for all of them.','If there are multiple Scrum Teams working together on a product, they must mutually define and comply with the same Definition of Done.','Commitment: Definition of Done','A team may be stricter for its own work, but never below the shared definition.'],
 ['The more people, the more lines of communication. When a team grows too large, it should reorganize into several Scrum Teams that share one Product Goal, Product Backlog and Product Owner.','The Scrum Team is small enough to remain nimble and large enough to complete significant work within a Sprint, typically 10 or fewer people.','Scrum Team','The guide says typically 10 or fewer. It gives no exact number.'],
 ['There is no testing team inside the team and no boss inside the team. People bring different skills, and the team as a whole answers for the result: the entire Scrum Team is accountable for creating a valuable, useful Increment every Sprint.','Within a Scrum Team, there are no sub-teams or hierarchies. It is a cohesive unit of professionals focused on one objective at a time, the Product Goal.','Scrum Team','Accountabilities such as Product Owner are not ranks.'],
 ['The Developers create the Sprint Backlog and update it throughout the Sprint as they learn. Nobody else tells them how to turn items into an Increment.','The Sprint Backlog is a plan by and for the Developers.','Sprint Backlog','The Product Owner orders the Product Backlog, not the Developers’ tasks.'],
 ['The Scrum Master helps the Product Owner be effective: techniques, clear items, empirical planning, and stakeholder collaboration when needed.','Helping find techniques for effective Product Goal definition and Product Backlog management','Scrum Master','The Scrum Master does not order the backlog or decide for the Product Owner.'],
 ['The Developers inspect progress toward the Sprint Goal and adjust their plan for the next day. They choose the format themselves.','The Daily Scrum is a 15-minute event for the Developers of the Scrum Team.','Daily Scrum','It is not a status report to the Scrum Master or the Product Owner.'],
 ['The Scrum Master is also accountable for the Scrum Team’s effectiveness, and serves the team, the Product Owner and the organization.','The Scrum Master is accountable for establishing Scrum as defined in the Scrum Guide. They do this by helping everyone understand Scrum theory and practice, both within the Scrum Team and the organization.','Scrum Master','The Scrum Master is not a team manager, and not a secretary for the events.'],
 ['Transparency makes the work visible. Inspection looks at it often. Adaptation changes course when something is off. Each depends on the one before.','These events work because they implement the empirical Scrum pillars of transparency, inspection, and adaptation.','Scrum Theory','Inspection without transparency misleads, and inspection without adaptation is pointless.'],
 ['The five values are Commitment, Focus, Openness, Respect and Courage. When people live them, transparency, inspection and adaptation become possible and trust grows.','Successful use of Scrum depends on people becoming more proficient in living five values','Scrum Values','Speed, efficiency and control are not Scrum Values.'],
 ['In complex work you cannot know the answers in advance. So you take a small step, look at the real result, and decide the next step from what you learned.','Empiricism asserts that knowledge comes from experience and making decisions based on what is observed.','Scrum Theory','Empiricism is not the absence of planning. Plans are revised as evidence arrives.'],
 ['Waste is anything that does not help deliver value: unfinished work, handovers, unused features, unnecessary detail. Lean thinking asks what can be left out.','Lean thinking reduces waste and focuses on the essentials.','Scrum Theory','It is not about keeping everyone busy. Full utilization often creates more waste.'],
 ['Scrum defines a small set of rules and leaves the practices to the people using it. Estimation techniques, user stories and boards are all optional additions.','The Scrum framework is purposefully incomplete, only defining the parts required to implement Scrum theory.','Scrum Definition','Calling Scrum a methodology or a process misses that it is a framework.'],
 ['Scrum suits work where more is unknown than known. Short cycles and frequent inspection let a team find a good solution step by step.','Scrum is a lightweight framework that helps people, teams and organizations generate value through adaptive solutions for complex problems.','Scrum Definition','Scrum is not only for software.'],
 ['One product needs one order of priorities. Separate backlogs or several Product Owners would create competing priorities and hide dependencies.','Therefore, they should share the same Product Goal, Product Backlog, and Product Owner.','Scrum Team','A Product Owner can delegate work to others, but the product still has one Product Owner and one Product Backlog.'],
 ['The Sprint Backlog answers why, what and how for the Sprint. It is detailed enough for the Developers to inspect their progress in the Daily Scrum.','The Sprint Backlog is composed of the Sprint Goal (why), the set of Product Backlog items selected for the Sprint (what), as well as an actionable plan for delivering the Increment (how).','Sprint Backlog','It is not a fixed contract. The plan changes during the Sprint. The Sprint Goal does not.'],
 ['Charts such as burn-downs help to see a trend. They describe the past. The future in complex work stays uncertain, so a forecast is updated every Sprint.','Only what has already happened may be used for forward-looking decision making.','The Sprint','Scrum requires no particular chart, and none of them is a promise.'],
 ['Those who do the work know best what it takes. The Product Owner can ask questions, explain the value and offer a smaller version, which often changes the size honestly.','The Developers who will be doing the work are responsible for the sizing. The Product Owner may influence the Developers by helping them understand and select trade-offs.','Product Backlog','Pressing for a lower number changes the estimate, not the work.'],
 ['The Daily Scrum is a short planning moment for the Developers. It improves communication, exposes impediments and reduces the need for other meetings.','The purpose of the Daily Scrum is to inspect progress toward the Sprint Goal and adapt the Sprint Backlog as necessary, adjusting the upcoming planned work.','Daily Scrum','The three questions from older versions of the guide are no longer required.'],
 ['Cross-functional is about the team, not each person. Self-managing means the team organizes its own work, inside the boundaries of Scrum and the Product Goal.','Scrum Teams are cross-functional, meaning the members have all the skills necessary to create value each Sprint. They are also self-managing, meaning they internally decide who does what, when, and how.','Scrum Team','Self-managing does not mean the team sets its own goals without the Product Owner.'],
 ['The Scrum Team commits to its goals and to each other, focuses on the work of the Sprint, is open about problems, respects each other as capable people and has the courage to do the right thing.','The Scrum Team members have the courage to do the right thing, to work on tough problems.','Scrum Values','Commitment is to the goal, not to delivering every selected item.'],
 ['Cutting quality hides the real state of the product and creates work for later. When time is short, the Developers and the Product Owner adjust the scope and keep the Sprint Goal.','Scope may be clarified and renegotiated with the Product Owner as more is learned.','The Sprint','Unfinished work passed off as done destroys transparency.']
];

const Q2=[
 [0,'s','Your product’s vision is to make stock control simple for small shops. A large customer offers to pay for a complex enterprise reporting module. What is the best first step?',['Assess how it fits the vision and strategy, and what it would cost in focus','Accept it, since paid work from a large customer is always valuable to the business','Decline at once, because a vision must never be stretched','Let the Developers decide whether it is technically interesting'],[0],'Revenue is one input. The Product Owner weighs it against the vision, the strategy and the value lost elsewhere, and then decides.'],
 [0,'s','A product tries to serve students, hospitals and banks at once. Usage is low in all three groups. What is the most valuable move?',['Choose one group to focus on, based on evidence','Add more features for each group so that nobody is left out','Increase the number of Developers so all groups progress faster','Lengthen the Sprints so that more work fits into each one'],[0],'Strategy means choosing. Serving everyone a little usually serves nobody well.'],
 [0,'s','Developers say they do not see how their Sprint work relates to the company’s direction. What should the Product Owner improve first?',['The link between the vision, the Product Goal and each Sprint Goal','The level of detail in the Product Backlog items, so that nothing is left open','The velocity target that the team works toward','The frequency of status reports to management'],[0],'People make better decisions when they can trace their work to the Product Goal and the vision.'],
 [0,'s','Management judges your product work by scope, time and budget. Which change would the Product Owner argue for?',['Judging success by the value delivered to customers and the organization','Adding quality as a fourth measure next to scope, time and budget','Reporting the same three measures more often, every Sprint','Fixing the scope earlier, so that time and budget are easier to plan and to meet'],[0],'A product mindset measures outcomes. Scope, time and budget show whether a plan was followed, not whether it was worth following.'],
 [0,'s','A competitor releases a free version of your product’s main feature. What is the most professional response?',['Inspect what it means for customers and for the strategy','Copy the competitor’s roadmap so that the products stay comparable','Ignore it, because the roadmap for the year has been agreed','Stop the Sprint immediately and wait for management to decide'],[0],'A market change is new evidence. The Product Owner inspects it and adapts the strategy and the goal when the evidence calls for it.'],
 [1,'s','The board wants one number to show that the product is doing well, and proposes velocity. What do you offer instead?',['A small set of outcome measures, such as customer satisfaction and usage','Velocity per Developer, which is more precise than the velocity of the whole team','The number of features released in each quarter','The percentage of the yearly budget that has been spent'],[0],'Velocity is output. Outcome measures tied to the product’s goals show whether customers and the organization benefit.'],
 [1,'s','Customers are very satisfied, and research finds almost no unmet needs in this market. What does this suggest for investment?',['Further investment here may return little','Double the team, to stay ahead of the competition','Stop measuring satisfaction, since it is already high','Rebuild the product on new technology while things are calm'],[0],'High Current Value with low Unrealized Value means there is little left to gain. Investment may pay off more elsewhere.'],
 [1,'s','Developers report that most of each Sprint goes to fixing defects and working around old code. Stakeholders want more features. What should the Product Owner do?',['Make the cost visible, and order work that restores the ability to deliver','Insist on the features, since code quality is for the Developers to sort out in their own time','Stop all feature work until the code base is perfect','Ask for a second team that only handles the defects'],[0],'A falling Ability to Innovate is a product problem. The Product Owner makes the trade-off transparent and orders the work with the Developers.'],
 [1,'s','A feature built for an important stakeholder has been live for two months. What should happen now?',['Check whether it produced the intended outcome','Consider it finished, since the stakeholder approved it','Start on the same stakeholder’s next request','Leave it out of future reports, since it is delivered'],[0],'Delivery is not the end. Value is confirmed only by what happens after release.'],
 [1,'s','An idea could be very valuable or worthless, and nobody knows which. Building it fully would take six Sprints. What is the best approach?',['Find the riskiest assumption and test it with something small first','Build it fully, since the potential value is high','Drop it, since the risk of waste is high','Ask all the stakeholders to vote on whether it is worth building at all'],[0],'When uncertainty is high, buy information cheaply before investing heavily.'],
 [2,'s','Two items have similar value. One carries a large technical uncertainty that could change the whole plan. How might the Product Owner order them?',['Take the uncertain one early, to learn while change is still cheap','Leave the uncertain one for last, so that the plan stays stable for now','Order them alphabetically, since the value is equal','Let the stakeholders vote on the order'],[0],'Ordering weighs value, risk, dependencies and learning. Reducing a big uncertainty early protects everything that follows.'],
 [2,'s','A large item will take three Sprints before anything can be used. What should the Product Owner and the Developers try?',['Split it into smaller slices that each deliver something usable','Make the Sprint three months long for this one item','Split it into a design Sprint, a build Sprint and a test Sprint','Accept it, since some work is simply large'],[0],'Thin slices that are usable bring value and feedback every Sprint, and keep the Sprint at one month or less.'],
 [2,'s','Every request from every stakeholder is added to the Product Backlog, and nothing is ever declined. What is the effect?',['The backlog stops showing what matters','Stakeholders are satisfied, which maximizes the value of the product','Transparency improves, since every request is listed','The Developers can choose freely from a wide range of items'],[0],'Owning a product includes saying no. A backlog that holds everything hides what matters.'],
 [2,'s','The Product Owner writes detailed specifications for all items planned for the next year. What is the main risk?',['Much of the detail will be waste, as items change or are never built','The Developers will have too little left to discuss during refinement','Sprint Planning will become too short to be useful','Stakeholders will lose interest in the Sprint Review'],[0],'Detail is added just in time. Items far from the top are likely to change.'],
 [2,'s','Every feature must meet the same response-time standard. Where does this belong?',['In the Definition of Done, since it applies to every Increment','In a separate Product Backlog item that is ordered near the bottom','In the Sprint Goal of each Sprint','In a checklist kept by the Scrum Master'],[0],'A quality standard that applies to all work belongs in the Definition of Done.'],
 [3,'s','The team finishes between 5 and 9 items per Sprint. About 40 items remain for the Product Goal. A stakeholder asks for a date. What is the most honest answer?',['A range, such as roughly 5 to 8 Sprints, updated every Sprint','Exactly 6 Sprints, based on the average','No answer, since Scrum does not work with dates or deadlines of any kind','5 Sprints, to show ambition'],[0],'A forecast from real data is a range. It gets narrower and more reliable as the team learns.'],
 [3,'s','A trade fair date cannot move. What is the best way to plan toward it?',['Fix the date and keep the scope flexible, most valuable items first','Fix both the date and the scope now, and add more people later if needed','Lower the Definition of Done as the date approaches','Plan the release for just after the fair, to be safe'],[0],'When the date is fixed, scope is the variable. Ordering by value means the most important work is done whatever happens.'],
 [3,'s','A team has a Done Increment every Sprint but releases only twice a year. What is the cost?',['Value and feedback are delayed, and each release carries more risk','None, since the Increment is Done every Sprint','The Developers lose their focus on the Sprint Goal','The Product Backlog becomes shorter than it should be, as items are held back'],[0],'Unreleased work delivers no value and no evidence. Large, rare releases also concentrate risk.'],
 [3,'s','Stakeholders want a roadmap for the year. Which form serves them best in complex work?',['Goals and outcomes, more precise for the near term and looser further out','A list of features with a delivery date for each one','A Gantt chart that shows the tasks of each Developer, week by week, for the whole year','None, since a roadmap contradicts Scrum'],[0],'A roadmap of outcomes gives direction and stays honest about what is not yet known.'],
 [3,'s','The company plans one big launch after a year of development. Which risk should the Product Owner raise?',['A year passes without evidence that customers want it','The Developers will forget the work they did early on','The Sprint Reviews will be too short to show everything','Competitors will not be able to copy the product'],[0],'The longer the wait for real feedback, the larger the investment made on assumptions.'],
 [4,'s','The CEO insists on a feature that the evidence does not support. What is the most effective approach?',['Share the evidence and propose a small test','Build it without comment, since the CEO decides','Refuse, and escalate the matter to the board','Put it at the bottom of the backlog and hope it is forgotten'],[0],'Influence comes from evidence and from understanding the need behind a request. A small test lets the facts decide.'],
 [4,'s','A steering committee regularly reorders the Product Backlog after the Product Owner has ordered it. What is the consequence?',['The Product Owner cannot be accountable for value, and decisions slow down','Value increases, since more people with experience take part in the decision','Nothing changes, as long as the Developers are informed','The Scrum Master becomes accountable for the order'],[0],'Accountability needs authority. If others decide the order, nobody clearly answers for the value.'],
 [4,'s','The Product Owner hears about users only through the sales team. What is the risk?',['Decisions rest on filtered, second-hand information','None, since sales knows the customers best','Users may start to ask for too much','The Developers will be distracted from their work by too many questions'],[0],'Direct contact with users is how a Product Owner learns what is valuable. Every intermediary filters.'],
 [4,'s','Stakeholders have stopped coming to the Sprint Review. What should the Product Owner examine first?',['Whether the Review gives them real influence on what happens next','Whether attendance can be made compulsory','Whether the Review can be replaced by a written report that people read in their own time','Whether the Developers present their work well enough'],[0],'People attend when their input matters. A Review that only presents gives them no reason to come.'],
 [4,'s','A stakeholder is angry that their item has been low in the backlog for months. What is the best response?',['Be honest that it is unlikely to be done soon, and explain why','Promise it for the next Sprint, to calm them down','Move it up one place each Sprint, so that it gets there eventually','Tell them that the Developers decide what gets built'],[0],'Honesty about priorities lets a stakeholder plan. False hope costs trust later.'],
 [5,'s','In mid-Sprint an urgent request arrives that does not serve the Sprint Goal. What should the Product Owner do?',['Weigh it against the Sprint Goal with the Developers','Add it to the Sprint, since the Product Owner decides the order','Cancel the Sprint, as for any urgent request','Ask one Developer to do it quietly on the side'],[0],'No changes are made that endanger the Sprint Goal. Most urgent requests can wait a few weeks at most.'],
 [5,'s','At the end of each Sprint, testing is left for a later “hardening” phase. What does this mean for the Product Owner?',['The real state of the product is unknown','Nothing, as testing can be planned for later','More features are available to customers sooner','The Definition of Done is being applied well'],[0],'Work that is not Done hides risk. Without a Done Increment, the Product Owner cannot inspect or release with confidence.'],
 [5,'s','The Product Owner is rarely available during the Sprint, and Developers guess at what is meant. What is the likely result?',['Rework, and items that miss the intended value','Faster delivery, since nobody interrupts the Developers','A stronger Definition of Done','Shorter Sprint Reviews'],[0],'The Product Owner is a member of the Scrum Team. Questions answered late become rework.'],
 [5,'s','A team’s Sprint Goal is always “complete all selected items”. What is missing?',['A single objective that gives the work meaning and room to adapt','A longer list of items in the Sprint Backlog, so that the goal is more ambitious','Approval of the goal by the stakeholders','A velocity target for the Sprint'],[0],'A Sprint Goal says why the Sprint is valuable. A list of items gives no focus and no flexibility.'],
 [5,'s','The Product Owner skips Sprint Retrospectives, calling them “a team matter”. What is lost?',['The chance to improve how the Product Owner and the Developers work together','Nothing, since the Retrospective is meant for the Developers and the Scrum Master','Time for the Scrum Master to report on the Sprint','Feedback from stakeholders on the Increment'],[0],'The Retrospective is for the whole Scrum Team, and the Product Owner is part of it.'],
 [6,'s','A Product Owner gives the Developers detailed instructions on how to build each item. What is the effect?',['The Developers’ knowledge goes unused','Quality rises, as nothing is left to chance','Sprint Planning becomes unnecessary','The Scrum Master has less to do'],[0],'How the work is done is for the Developers to decide. Telling them how wastes their expertise.'],
 [6,'s','The Developers believe the Product Owner’s top item is a mistake. What should happen?',['The Product Owner listens to their reasoning, then decides and explains','The Developers choose another item for the Sprint, since they do the work','The Scrum Master decides between them','The Scrum Team votes on the order'],[0],'Openness means hearing the challenge. The decision on order still rests with the Product Owner.'],
 [6,'s','The Product Owner wants all customer contact to go through them, to protect the Developers’ time. What is the drawback?',['Developers lose understanding of the people they build for','None, since the Developers’ focus on the Sprint Goal improves','Customers will ask for fewer changes and less feedback than before','The Product Backlog becomes harder to order, with less detail for each item'],[0],'Developers who understand users make better decisions in the many small choices the Product Owner never sees.'],
 [6,'s','To show progress, the Product Owner presses the Developers to take on more each Sprint. What tends to happen?',['Quality and predictability fall, and less value is delivered over time','Value rises in line with the amount of work selected in Sprint Planning','The Developers become more self-managing','The Sprint Goal becomes clearer'],[0],'Pressure produces shortcuts and unfinished work. A sustainable pace delivers more over time.'],
 [6,'s','A Product Owner spends all their time writing items, and has none left for customers and strategy. What is a good way forward?',['Share the writing and refining with the Developers, while staying accountable','Hire a second Product Owner for the same product','Stop talking to customers for a few Sprints, until the backlog is complete and detailed','Ask the Scrum Master to order the Product Backlog'],[0],'The Product Owner may delegate the work and stays accountable. Their own time is best spent on value.'],
 [7,'s','A product has five Scrum Teams, each with its own Product Owner and backlog. Priorities conflict constantly. What is the underlying problem?',['One product needs one Product Backlog and one Product Owner','There are too few Scrum Masters to coordinate the work of five teams','The teams need longer Sprints to align','Each team needs its own Product Goal'],[0],'Teams on the same product share one Product Goal, one Product Backlog and one Product Owner.'],
 [7,'s','Three teams each show their own work at the Sprint Review, but it has not been integrated. What does the Product Owner really have?',['No usable Increment, and no reliable view of progress','Three Increments, one from each team, each tested on its own','A complete Increment that is ready and only awaits the release decision','Enough evidence to forecast when the Product Goal will be reached'],[0],'Only integrated, Done work is an Increment. Separate pieces say little about the state of the product.'],
 [7,'s','The organization funds work as yearly projects with a fixed scope. What makes product ownership hard in that setting?',['Decisions are fixed long before evidence is available','The budgets are usually set too low for the scope that is expected','Projects have too many stakeholders, each with a different idea of success','Sprints do not fit neatly into a calendar year and its budget cycle'],[0],'Fixed yearly scope locks in guesses. Empirical product management needs room to change course on evidence.'],
 [7,'s','Product Owners in a company are rewarded for the number of features released. What behavior does this invite?',['Releasing many features, used or not','Careful validation of every idea before building','Fewer, better features','Closer contact with customers'],[0],'People do what is measured. Rewarding output produces output, not value.'],
 [7,'s','A team works on three products for three Product Owners, who each want their work done first. What should the organization resolve?',['A single order of priorities for the team, with one person accountable for it','A fixed share of one third of the team’s time for each Product Owner, every Sprint','A rule that the oldest request always wins','Nothing, since the team can self-manage it'],[0],'A team needs one ordered source of work. Competing priorities cannot be solved by the Developers.'],
 [0,'s','Sales has promised three customers different custom features. None of them fits the product strategy. What should the Product Owner do?',['Explain the strategy and look for the need behind each request','Add all three, since promises to customers must be kept','Ask the Scrum Master to tell the sales team to stop making promises','Create a separate backlog for sales requests'],[0],'Requests are input. The Product Owner looks for the underlying need and decides in line with the strategy.'],
 [0,'s','Which signals that a product strategy involves real choices?',['It states which customers and needs the product will not serve','It lists every feature that competitors have','It promises growth in all market segments','It was approved by all stakeholders without discussion'],[0],'A strategy that excludes nothing gives no guidance when priorities compete.'],
 [0,'s','A Scrum Team reaches every Sprint Goal, yet the Product Goal is no closer. What does this suggest?',['The Sprint Goals are not steps toward the Product Goal','The Developers should work faster and select more items each Sprint','The Definition of Done is too strict for the kind of work being done','The Sprints are too short to show any visible progress at all'],[0],'Each Sprint should bring the product closer to the Product Goal. Goals that do not connect produce activity without progress.'],
 [0,'s','A release shipped on time and on budget, but customers do not use it. From a product mindset, how do you see the result?',['As not yet a success, because the intended outcome was not achieved','As a success, since the plan was met','As a failure of the Developers','As a reason to stop releasing for a while, until the plan is reviewed by management'],[0],'Meeting the plan is not the goal. The goal is the outcome for customers and the organization.'],
 [0,'s','After three experiments, the data shows that your target customers do not have the problem you set out to solve. What now?',['Consider a change of direction, and be transparent about the evidence','Run the same experiments again with more customers, until they succeed','Build the full product to prove the idea','Keep the findings within the Scrum Team'],[0],'Evidence against an idea is valuable. Changing direction early is cheaper than proving a point.'],
 [1,'s','Current Value is high and stable, but Ability to Innovate is falling. What does this indicate?',['The capacity to deliver new value is eroding','The product needs no further investment for now','The team should release less often','Unrealized Value must be zero'],[0],'The Key Value Areas are read together. Strong value today can hide a weakening ability to deliver tomorrow.'],
 [1,'s','A product has low Current Value, but research shows large unmet needs. How should the Product Owner read this?',['There is potential worth investing in, if the gap can be closed','The product should be retired at once, since the current value is low','The team is underperforming and needs a change of people or process','Marketing should be the only focus, to close the gap through promotion'],[0],'High Unrealized Value points to opportunity. Whether to invest depends on the ability to close the gap.'],
 [1,'s','Which measure most directly shows that technical debt is hurting the product?',['The share of effort spent on new capabilities keeps shrinking','The number of items in the Product Backlog is growing every Sprint','Sprint Reviews are taking longer','Velocity is stable'],[0],'When more and more effort goes into keeping things running, less is left for new value. That is Ability to Innovate falling.'],
 [1,'s','Before building an expensive item, what should the Product Owner define with the team?',['How they will know afterwards that it delivered value','The exact number of hours it will take to build the item in full','Which Developer will build it and how many hours they will need','The date of the launch event and the marketing plan that goes with it'],[0],'Deciding the measure of success in advance makes it possible to learn from the result.'],
 [1,'s','Two tests are on the table: a survey asking customers whether they would pay, or a simple offer they can actually buy. Which gives stronger evidence?',['The real offer, because it observes behavior and not opinion','The survey, because more people can answer it','Neither, since only a finished product with all features counts as evidence','Both are equally strong'],[0],'What people do is stronger evidence than what they say they would do.'],
 [2,'s','Which is a sound reason to place a lower-value item above a higher-value one?',['The higher-value item depends on it','The requester has been waiting the longest','It is easier to explain to stakeholders','The Developers find it more enjoyable'],[0],'Order is not a ranking by value alone. Dependencies, risk and learning can move an item up.'],
 [2,'s','A team splits an item into “database”, “business logic” and “screen”. What is the drawback?',['None of the parts is usable alone, so feedback and value are delayed','The parts are too small to estimate','The Product Owner cannot order technical items','There is none, since this is the recommended way to split a large item'],[0],'Splitting by technical layer yields parts that cannot be used or validated by themselves.'],
 [2,'s','Which behavior shows a Product Owner who owns the product, and does not merely take orders?',['Declining requests that do not serve the Product Goal, and explaining why','Writing every request as a detailed user story','Asking the stakeholders to rank the whole backlog','Passing each request to the Developers on the day it arrives, so nothing is lost'],[0],'Ownership shows in decisions. Recording and passing on requests is the work of a clerk.'],
 [2,'s','Developers often discover in mid-Sprint that items were misunderstood. What would help most?',['Refining upcoming items together before Sprint Planning','Longer written specifications from the Product Owner for each item','A sign-off from stakeholders on each item','Adding a buffer Sprint after every third Sprint'],[0],'Shared understanding comes from conversation during refinement, more than from longer documents.'],
 [2,'s','Security work keeps being postponed in favor of features. What should the Product Owner recognize?',['Security is part of the product’s value and risk','Security is a technical matter outside the Product Owner’s concern','It can wait until customers ask for it','The Scrum Master should order that work'],[0],'The Product Owner is accountable for the value of the whole product, which includes the risks it carries.'],
 [3,'s','A forecast made three Sprints ago now looks too optimistic. What should the Product Owner do?',['Share the updated forecast and discuss the options with stakeholders','Keep the old one until the Product Goal is reached, to avoid confusion','Ask the Developers to catch up and work longer hours to recover','Quietly remove the forecast from the roadmap before anyone notices it'],[0],'A forecast is updated as evidence arrives. Sharing it early gives stakeholders time to act.'],
 [3,'s','Six weeks before a fixed date, the forecast shows that not everything will fit. What is the best option?',['Decide with stakeholders which items matter most','Skip testing for the less important items','Add Developers from other teams this week','Extend the Sprints so that more work fits into each'],[0],'Quality does not decrease. With a fixed date, the choice is about scope, made together with stakeholders.'],
 [3,'s','Operations asks to release only once a quarter, to keep things stable. How should the Product Owner approach this?',['Work with them on making releases smaller and safer','Agree, since stability comes first','Release anyway, without telling them','Ask the Scrum Master to overrule the operations department'],[0],'Large, rare releases are usually the riskier ones. The shared goal is releases that are small and safe.'],
 [3,'s','A roadmap item for next quarter has been overtaken by events. What does a professional Product Owner do?',['Update the roadmap and explain the change to stakeholders','Deliver it anyway, because it was on the roadmap','Leave it there until someone asks','Remove the roadmap altogether'],[0],'A roadmap is a current view of direction. Keeping it accurate keeps it trusted.'],
 [3,'s','How can a new product reduce the risk of building the wrong thing?',['Release a small first version to a limited group','Complete all features before anyone sees it','Ask managers to approve the specification','Hire more testers before the launch'],[0],'A small early release exposes assumptions to real use while changing course is still cheap.'],
 [4,'s','A Product Owner has no formal authority over the departments the product depends on. What helps most?',['Building understanding of the product’s goals and of what each party gains','Asking the Scrum Master to give those departments instructions on behalf of the team','Waiting for a reorganization','Working around those departments'],[0],'Much of product ownership is influence without authority, built on shared goals and trust.'],
 [4,'s','A Product Owner must ask a manager for approval of every ordering decision. What should be addressed?',['The Product Owner’s mandate, so that the person accountable can decide','The speed of the approval process and the number of people who sign it','The format of the Product Backlog and the tools used to keep it','The length of the Sprint and the timing of the Sprint Review'],[0],'For Product Owners to succeed, the organization must respect their decisions. Without a mandate, the accountability is empty.'],
 [4,'s','The people who buy your product are managers, but the people who use it are their staff. Whose needs matter for value?',['Both, since either group can make the product fail','Only the buyers, who decide and pay for the product','Only the users, who work with the product every single day','Neither, since the vision alone decides what the product should do'],[0],'Buyers and users often want different things. A product has to work for both to deliver value.'],
 [4,'s','Which Sprint Review gives the Product Owner the most useful input?',['Stakeholders try the Increment and discuss what should come next','The team presents slides and stakeholders applaud','The Product Owner approves or rejects each item in front of everyone','Management checks progress against the plan'],[0],'The Sprint Review is a working session about the outcome and the next steps.'],
 [4,'s','Why is a clear no often better for a stakeholder than a vague maybe?',['They can plan around it and look for another solution','It ends the discussion for good and avoids more questions','It shows clearly who is in charge of the product and its decisions','It reduces the size of the backlog by removing the item from it'],[0],'Clarity lets people act. An item left to linger keeps a stakeholder waiting for nothing.'],
 [5,'s','Something critical comes up, and the Sprint Goal no longer makes sense. What is within the Product Owner’s authority?',['Cancelling the Sprint, after which the team plans again','Replacing the Sprint Goal and continuing the same Sprint','Extending the Sprint to fit both pieces of work','Assigning the critical work to the Scrum Master'],[0],'Only the Product Owner can cancel a Sprint, and only when the Sprint Goal has become obsolete.'],
 [5,'s','The Product Owner is tempted to count nearly finished items as Done, to show progress. What is the harm?',['Transparency is lost, and decisions are made on a false picture','None, if the items are finished and shown in the next Sprint','Stakeholders will expect less from the team in future Sprints','The Sprint Goal becomes invalid, so the Sprint has to be cancelled'],[0],'Work is either Done or not. Counting undone work misleads everyone who relies on the Increment.'],
 [5,'s','How should the Product Owner be involved during the Sprint?',['Available to clarify and give feedback as the Developers learn','Absent, so that the Developers can self-manage','Present to check each Developer’s tasks every day','Involved only at the start and the end, in Sprint Planning and the Sprint Review'],[0],'The Product Owner collaborates with the Developers throughout the Sprint, without directing their work.'],

const LEVELS={
 1:{name:'PSPO I',THEMES:THEMES1,Q:Q1,CHEAT:CHEAT1,NOTES:NOTES1,HALF:80,n:80,min:60},
 2:{name:'PSPO II',THEMES:THEMES2,Q:Q2,CHEAT:CHEAT2,NOTES:NOTES2,HALF:40,n:40,min:60}
};
/* the active level; an idea (concept) has two or more questions that word it differently */
let THEMES,Q,CHEAT,NOTES,HALF,NC,VARS,EX;
const concept=id=>Q[id][6]!=null?Q[id][6]:id<HALF?id:id-HALF;
const twin=id=>{const v=VARS[concept(id)];return v[0]===id?v[1]:v[0]};
function useLevel(l){
  const L=LEVELS[l];
  THEMES=L.THEMES;Q=L.Q;CHEAT=L.CHEAT;NOTES=L.NOTES;HALF=L.HALF;EX={n:L.n,min:L.min};
  VARS=[];Q.forEach((_,i)=>{const c=concept(i);(VARS[c]=VARS[c]||[]).push(i)});
  NC=VARS.length;
}
const STAGES=['🥚','🐣','🐥','🦖'];
/* ---------- state ---------- */
const freshProg=()=>({q:{},th:{},best:0,xp:0,ex:[],day:{d:'',n:0},ds:0,dl:''});
let settings=Object.assign({pass:85,sound:true,theme:'auto',count:10,level:1,accent:'mint'},store.get(K.set,{}));
if(!PSPO_ACCENTS[settings.accent])settings.accent='mint';
if(!LEVELS[settings.level])settings.level=1;
let prog,round;
function loadLevel(){
  useLevel(settings.level);
  prog=Object.assign(freshProg(),store.get(K.prog,{}));
  round=store.get(K.round,null);
  const r=round;
  if(r&&(!Array.isArray(r.log)||!r.mode||(r.mode==='exam'&&(!r.ans||!Array.isArray(r.order)||r.order.some(i=>!Q[i])))||(r.mode!=='exam'&&r.lives==null)||(r.cur&&!Q[r.cur.id])))round=null;
}
loadLevel();
let summary=null,view='home',showSettings=false,showOver=false,cheat=null,resetArm=false,timer=null,ringAnim=false,deferred=null;

const save=()=>{store.set(K.prog,prog);store.set(K.set,settings);if(round)store.set(K.round,round);else store.del(K.round)};
const qp=id=>prog.q[id]||(prog.q[id]={box:0,streak:0,misses:0,tries:0,seen:0,won:false});
const stageOf=p=>STAGES[Math.min(3,Math.max(0,p.misses-1))];
const optsOf=q=>q[3]||['True','False'];
const sameSet=(a,b)=>a.length===b.length&&a.every(x=>b.includes(x));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const wpick=(items,ws)=>{let r=Math.random()*ws.reduce((a,b)=>a+b,0);for(let i=0;i<items.length;i++){r-=ws[i];if(r<=0)return items[i]}return items[items.length-1]};
const pick1=a=>a[Math.floor(Math.random()*a.length)];

function strength(t){const a=(prog.th[t]||[]).slice(-15);return (a.reduce((x,y)=>x+y,0)+1)/(a.length+2)}
function weakestThemes(n){
  const withData=THEMES.map((_,i)=>i).filter(t=>(prog.th[t]||[]).length>=3);
  if(!withData.length)return null;
  return withData.sort((a,b)=>strength(a)-strength(b)).slice(0,n);
}
const GOAL=10;
const dstr=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>dstr(new Date());
const yesterday=()=>{const y=new Date();y.setDate(y.getDate()-1);return dstr(y)};
function bumpDay(n){
  const t=today();
  if(prog.day.d!==t)prog.day={d:t,n:0};
  const before=prog.day.n;prog.day.n+=n;
  if(before<GOAL&&prog.day.n>=GOAL){prog.ds=prog.dl===yesterday()?prog.ds+1:1;prog.dl=t;return true}
  return false;
}
const dayStreak=()=>(prog.dl===today()||prog.dl===yesterday())?prog.ds:0;
function understood(){let n=0;VARS.forEach(v=>{if(v.filter(i=>prog.q[i]&&prog.q[i].last===1).length>=2)n++});return n}
function readiness(){
  const answered=Object.values(prog.q).reduce((a,p)=>a+p.seen,0);
  if(answered<15)return null;
  const ss=THEMES.map((_,t)=>{const a=(prog.th[t]||[]).slice(-15),c=a.reduce((x,y)=>x+y,0);return {t,s:c/Math.max(a.length,10),n:a.length}});
  const avg=ss.reduce((a,x)=>a+x.s,0)/ss.length;
  const mn=Math.min(...ss.map(x=>x.s));
  const u=understood();
  const score=Math.round(100*(0.45*avg+0.25*mn+0.30*u/NC));
  const wk=ss.filter(x=>x.n>=3).sort((a,b)=>a.s-b.s)[0];
  const ready=score>=85&&mn>=0.75;
  return {score,ready,u,label:ready?'Ready for exam mode 🚀':score>=65?'Getting close 🌤️':'Not yet 🌱',weak:wk?wk.t:null,fresh:ss.filter(x=>x.n<10).length};
}
function applyTheme(){const r=document.documentElement;if(settings.theme==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',settings.theme);pspoAccent()}
if(window.matchMedia)matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>pspoAccent());

/* ---------- selection logic ---------- */
function pickNext(r){
  const due=Object.keys(r.due).filter(id=>r.due[id]<=0).map(Number);
  while(due.length){
    const id=due.shift();delete r.due[id];
    if(!r.asked.includes(id))return id;
    const t=twin(id);
    if(!r.asked.includes(t)){r.tw[t]=true;return t}
  }
  const all=THEMES.map((_,i)=>i);
  const ok=i=>!VARS[concept(i)].some(v=>r.asked.includes(v));
  const avail=t=>Q.some((q,i)=>q[0]===t&&ok(i));
  const cap=Math.max(2,Math.ceil(r.total*0.4));
  const counts={};r.log.forEach(l=>{counts[l.t]=(counts[l.t]||0)+1});
  const pool=r.themes&&r.themes.length?r.themes:all;
  let cands=pool.filter(t=>avail(t)&&(counts[t]||0)<cap);
  if(!cands.length)cands=pool.filter(avail);
  if(!cands.length)cands=all.filter(avail);
  if(!cands.length)return null;
  const ws=cands.map(t=>r.weak?0.1+Math.pow(1-strength(t),2)*2.2:0.15+(1-strength(t))*1.2);
  const t=wpick(cands,ws);
  const ids=Q.map((_,i)=>i).filter(i=>Q[i][0]===t&&ok(i));
  const qw=ids.map(i=>{const p=prog.q[i];if(!p||!p.seen)return 3;let w=[3,5,3.5,2,1.2,.8][p.box]||1;if(p.streak>=2)w=Math.min(w,1);return w});
  return wpick(ids,qw);
}

/* ---------- round flow ---------- */
const MAXL=3;
function examOrder(){
  const ids=[];
  for(let g=0;g<NC;g++){
    const v=VARS[g],seen=v.map(i=>prog.q[i]?prog.q[i].seen:0),m=Math.min(...seen);
    ids.push(pick1(v.filter((_,k)=>seen[k]===m)));
  }
  return shuffle(ids).slice(0,EX.n);
}
function startRound(mode,themes){
  const r={mode,total:settings.count,log:[],asked:[],due:{},tw:{},themes:themes||null,weak:mode==='weak',streak:0,best:0,conq:0,lucky:0,solid:0,lives:MAXL,t0:Date.now()};
  if(mode==='exam'){r.order=examOrder();r.total=r.order.length;r.ans={};r.flag={};r.ord={};r.i=0;r.endsAt=r.t0+EX.min*60000}
  round=r;summary=null;view='quiz';showOver=false;
  if(mode==='exam'){save();render();window.scrollTo(0,0);startTimer()}else present();
}
function present(){
  const r=round;
  const id=pickNext(r);
  if(id==null){finish();return}
  const q=Q[id];qp(id);
  const n=optsOf(q).length;
  const order=q[1]==='t'?[0,1]:shuffle([...Array(n).keys()]);
  r.cur={id,order,sel:[],done:false,ok:null,ev:null};
  if(!r.asked.includes(id))r.asked.push(id);
  save();render();window.scrollTo(0,0);
}
function record(){
  const r=round,c=r.cur,q=Q[c.id],p=qp(c.id),t=q[0];
  const ok=sameSet(c.sel,q[4]);
  c.ok=ok;c.done=true;c.life=false;
  const oldStage=stageOf(p);
  const tid=twin(c.id),tp=prog.q[tid];
  p.seen++;p.tries++;p.last=ok?1:0;
  let ev=null;
  if(ok){
    p.streak++;p.box=Math.min(5,p.box+1);r.streak++;
    r.best=Math.max(r.best,r.streak);prog.best=Math.max(prog.best,r.streak);prog.xp+=10;
    if(p.misses>0){
      if(p.streak===2){ev={k:'defeated',tries:p.tries};p.won=true;r.conq++;prog.xp+=10}
      else if(p.streak<2)ev={k:'progress'};
    }
    if(p.streak>=2)delete r.due[c.id];else if(p.misses>0)r.due[c.id]=3;
    if(r.streak%5===0&&r.lives<MAXL){r.lives++;c.life=true}
  }else{
    p.streak=0;p.box=1;p.misses++;r.streak=0;r.lives--;
    ev={k:p.misses===1?'appear':'evolve',from:oldStage,to:stageOf(p)};r.due[c.id]=2;
  }
  /* understanding check against the twin (same idea, different wording) */
  c.tw=null;
  if(tp&&tp.seen>0){
    if(ok&&tp.last===1){c.tw='solid';r.solid++}
    else if(!ok&&tp.last===1){c.tw='lucky';r.lucky++}
    else if(ok&&tp.last===0)c.tw='both';
  }
  Object.keys(r.due).forEach(k=>{if(+k!==c.id)r.due[k]--});
  if(ok&&!r.asked.includes(tid)&&r.due[tid]==null&&!(tp&&tp.last===1)&&r.total-r.log.length>4){r.due[tid]=3;r.tw[tid]=true}
  prog.th[t]=((prog.th[t]||[]).concat(ok?1:0)).slice(-15);
  r.log.push({id:c.id,t,ok,sel:c.sel.slice()});
  c.ev=ev;c.over=r.lives<=0;
  if(bumpDay(1))r.goal=true;
  if(ok){beep([[660,0,.12],[880,.1,.16]]);haptic(15)}else beep([[330,0,.2]]);
  save();
}
function submitExam(){
  const r=round;if(!r||r.mode!=='exam')return;
  stopTimer();
  let answered=0;
  r.order.forEach((id,i)=>{
    const q=Q[id],p=qp(id),sel=r.ans[i]||[],ok=sameSet(sel,q[4]);
    if(sel.length)answered++;
    p.seen++;p.tries++;p.last=ok?1:0;
    if(ok){p.streak++;p.box=Math.min(5,p.box+1)}else{p.streak=0;p.box=1;p.misses++}
    prog.th[q[0]]=((prog.th[q[0]]||[]).concat(ok?1:0)).slice(-15);
    r.log.push({id,t:q[0],ok,sel,skipped:!sel.length});
  });
  const c=r.log.filter(l=>l.ok).length;
  prog.ex=(prog.ex||[]).concat({p:Math.round(c/r.log.length*100),d:today()}).slice(-5);
  prog.xp+=c*5;const goal=bumpDay(answered);
  finishWith({mode:'exam',exam:true,log:r.log.slice(),best:0,conq:0,over:false,lucky:0,solid:0,goal});
}
function finish(over){
  const r=round;if(!r)return;
  stopTimer();
  finishWith({mode:r.mode,exam:false,log:r.log.slice(),best:r.best,conq:r.conq,over:!!over,lucky:r.lucky,solid:r.solid,goal:!!r.goal});
}

const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');

  const r=round,answered=r.order.filter((_,i)=>(r.ans[i]||[]).length).length;
  const used=(Date.now()-r.t0)/(r.endsAt-r.t0);
  if(used<.08)return '';

let ac=null;
function beep(seq){
  if(!settings.sound)return;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    seq.forEach(([f,t,d])=>{
      const o=ac.createOscillator(),g=ac.createGain(),s=ac.currentTime+t;
      o.type='triangle';o.frequency.value=f;
      g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(.12,s+.02);g.gain.exponentialRampToValueAtTime(.0001,s+d);
      o.connect(g);g.connect(ac.destination);o.start(s);o.stop(s+d+.05);
    });
  }catch(e){}
}
function haptic(p){try{if(navigator.vibrate)navigator.vibrate(p)}catch(e){}}
function calc(){
  const S=summary,total=S.log.length,correct=S.log.filter(l=>l.ok).length;
  const pct=total?Math.round(correct/total*100):0;
  const PASS=settings.pass;
  const tier=pct===100?'perfect':pct>=PASS?'pass':pct>=PASS-10?'close':'not';
  const by={};S.log.forEach(l=>{const b=by[l.t]||(by[l.t]={t:l.t,n:0,c:0});b.n++;if(l.ok)b.c++});
  const th=Object.values(by).map(b=>Object.assign(b,{pct:Math.round(b.c/b.n*100)}));
  return {total,correct,pct,PASS,tier,th};
}
function celebrate(){
  const C=calc();
  if(C.tier==='not'||summary.over)return;
  if(C.tier==='close'){haptic(30);return}
  haptic([80,40,80,40,160]);
  beep([[523,0,.18],[659,.16,.18],[784,.32,.18],[1047,.5,.4]]);
}
